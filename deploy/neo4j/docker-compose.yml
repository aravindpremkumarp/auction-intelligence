# Self-hosted Neo4j Community for auction-intelligence.
#
# Lives in /opt/neo4j on the Oracle VM, separate from the Postiz stack in
# /opt/postiz: restarting one never touches the other.
#
# Sized for a 12 GB VM shared with Postiz (~3 GB): Neo4j is capped at ~4.5 GB.
# When the graph grows (see README "Growing"), raise heap/pagecache together
# with mem_limit.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      # Bolt — the app (Render), CI and scripts connect here. TLS is REQUIRED,
      # so traffic over the public internet is always encrypted.
      - "7687:7687"
      # Browser / HTTP API — bound to localhost only. Reach it through an SSH
      # tunnel: ssh -L 7474:localhost:7474 -L 7687:localhost:7687 ubuntu@<vm>
      - "127.0.0.1:7474:7474"
    # auth.env holds only NEO4J_AUTH=neo4j/<password> (written by setup.sh).
    # It is an env_file, not ${...} interpolation, so a NEO4J_PASSWORD
    # variable in the calling shell can never override it.
    env_file: auth.env
    environment:
      # APOC core: the app's run_cypher tool allows APOC read procedures.
      NEO4J_PLUGINS: '["apoc"]'

      # Memory (see README for the sizing maths).
      NEO4J_server_memory_heap_initial__size: 1500m
      NEO4J_server_memory_heap_max__size: 1500m
      NEO4J_server_memory_pagecache_size: 1500m
      # One runaway query can't take more than this; it fails instead of
      # starving the heap.
      NEO4J_dbms_memory_transaction_total_max: 1000m

      # Bolt TLS (self-signed cert generated by setup.sh -> clients use
      # bolt+ssc:// or neo4j+ssc://).
      NEO4J_server_bolt_tls__level: REQUIRED
      NEO4J_dbms_ssl_policy_bolt_enabled: "true"
      NEO4J_dbms_ssl_policy_bolt_base__directory: /ssl/bolt
      NEO4J_dbms_ssl_policy_bolt_private__key: private.key
      NEO4J_dbms_ssl_policy_bolt_public__certificate: public.crt
      NEO4J_dbms_ssl_policy_bolt_client__auth: NONE

      # Address the routing table hands back to neo4j:// clients.
      NEO4J_server_default__advertised__address: ${NEO4J_PUBLIC_HOST:?set NEO4J_PUBLIC_HOST in /opt/neo4j/.env}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./backups:/backups
      - ./certs:/ssl/bolt:ro
    # Hard ceiling so Neo4j can never push Postiz out of memory.
    mem_limit: 4500m
