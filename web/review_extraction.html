<!doctype html>
<meta charset="utf-8">
<title>Extraction review</title>
<!--
  Editable grounded review surface for LangExtract output.
  Three panes: original notice (image/pdf, via R2 public_url or the API's
  /review/notice/{f}/source proxy) | highlighted markdown | editable fields.
  Marks and cards share data-fid, so clicking either aligns the other, and the
  ◀ ▶ bar buttons / arrow keys step through the highlights langextract-style.
  Talks to the admin-gated /review/extraction/* endpoints (api/review/extraction.py).
  Embedded as a same-origin iframe by web/review.html (the "extraction" stage pill).
  Auth: the API is bearer-token (Supabase), CORS allow_credentials=False — NOT cookies.
  We load the Supabase SDK + /auth.js and call window.Auth.fetchWithAuth, exactly like
  review.html. The iframe shares localStorage with the parent, so the admin's session
  is already present; no separate login needed.
-->
<script>
  // API base arrives via ?api= when review.html embeds us; fall back to same-origin.
  // Supabase env mirrors review.html so /auth.js can read the shared session.
  window.API_BASE = new URLSearchParams(location.search).get("api") || "";
  window.SUPABASE_URL = window.SUPABASE_URL || 'https://yrcrxpwoqddfcengkryw.supabase.co';
  window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_IT4CBVWS1a37sduWApOdFw_1UCR0kyJ';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Rendered-markdown mode (item 2): marked turns the OCR markdown — which
     contains real embedded <table> HTML — into a rendered table, DOMPurify
     sanitizes it. Same versions review.html ships; both are CSP-allowed by the
     /review_extraction(.html)? block in vercel.json. If either fails to load,
     render() falls back to the raw escaped view, so the page still works. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
<script src="/auth.js"></script>
<style>
 body{font-family:system-ui,Segoe UI,Arial;margin:0;color:#0f172a;background:#f1f5f9}
 #wrap{display:flex;height:100vh}
 #side{width:260px;background:#0f172a;color:#cbd5e1;overflow:auto;flex:none}
 #side h2{color:#fff;font-size:13px;padding:12px 14px;margin:0;border-bottom:1px solid #1e293b}
 .nav{padding:8px 14px;cursor:pointer;border-bottom:1px solid #1e293b;font-size:12px}
 .nav:hover{background:#1e293b}.nav.active{background:#2563eb;color:#fff}
 .nav .meta{color:#94a3b8;font-size:11px}
 .badge{border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700}
 .b-pending{background:#475569;color:#e2e8f0}.b-edited{background:#d97706;color:#fff}.b-verified{background:#16a34a;color:#fff}
 #main{flex:1;overflow:auto;padding:16px 20px}
 #bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
 button{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:6px 12px;font-size:13px}
 button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
 #doc{display:flex;gap:18px}
 #src{flex:1.3;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;white-space:pre-wrap;line-height:1.7;font-size:13px;max-height:84vh;overflow:auto}
 #fields{flex:1;max-height:84vh;overflow:auto}
 .fld{background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:9px 11px;margin-bottom:8px}
 .fld .c{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
 .fld textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:6px;padding:5px 7px;font-size:13px;font-family:inherit;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;resize:vertical;min-height:30px;overflow:hidden;display:block}
 .fld .save{margin-top:5px;font-size:12px;padding:3px 9px}
 .ung{background:#fee2e2;color:#991b1b;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700}
 .corr{color:#16a34a;font-size:11px;margin-top:3px}
 mark{border-radius:3px;padding:0 1px}
 #msg{font-size:12px;color:#64748b}
 /* source-notice pane + highlight↔card linking */
 #notice{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px;max-height:84vh;overflow:auto}
 #notice .imgwrap img{cursor:zoom-in}
 #notice .imgwrap.zoom img{cursor:zoom-out}
 #notice canvas{width:100%;height:auto;display:block}
 #notice .pagewrap{position:relative;display:block;margin-bottom:6px}
 mark[data-fid]{cursor:pointer}

 /* rendered-markdown mode (item 2): tables + block spacing, mirroring review.html */
 #src.rendered{white-space:normal}

 #src.rendered th{background:#f1f5f9;font-weight:600}
 #src.rendered p{margin:6px 0}#src.rendered h1,#src.rendered h2,#src.rendered h3{margin:10px 0 4px;font-size:15px}
 #src.rendered ul,#src.rendered ol{margin:6px 0 6px 20px;padding:0}
 #src.rendered code{background:#f1f5f9;padding:1px 4px;border-radius:3px}
 #src.rendered pre{background:#f1f5f9;padding:8px;overflow-x:auto;border-radius:6px}
 #src.rendered img{max-width:100%;height:auto}
 /* notice bounding-box overlay (item 3) */
 .imgwrap{position:relative;display:block;width:100%}
 .imgwrap.zoom{width:180%;max-width:none}
 .imgwrap img{width:100%;height:auto;display:block;border-radius:4px}
 .ovl{position:absolute;inset:0;pointer-events:none}
 .ovl.boxes-hidden{display:none}
 .bbx{position:absolute;border:1px solid rgba(37,99,235,.45);background:rgba(37,99,235,.05);box-sizing:border-box}
 .bbx.link{pointer-events:auto;cursor:pointer}
 .bbx.cur{border-color:#2563eb;background:rgba(37,99,235,.18);box-shadow:0 0 0 2px rgba(37,99,235,.35)}
 .bbl{position:absolute;top:-13px;left:0;font-size:9px;line-height:1.3;color:#1e40af;background:#fff;padding:0 3px;border-radius:2px;white-space:nowrap;pointer-events:none}
</style>
<div id="wrap">
  <div id="side"><h2>Extraction queue</h2><div id="nav"></div></div>
  <div id="main">
    <div id="bar">
      <h3 id="title" style="margin:0">Select a document</h3>
      <span id="status"></span>
      <button class="navbtn" onclick="nav(-1)" title="previous highlight (←)">◀</button>
      <span id="pos">– / –</span>
      <button class="navbtn" onclick="nav(1)" title="next highlight (→)">▶</button>
      <span style="flex:1"></span>
      <button id="mdBtn" onclick="toggleMdMode()" title="raw markdown ↔ rendered">✦ rendered</button>
      <button id="imgBtn" onclick="toggleImgPane()">🖼 notice</button>
      <button id="boxBtn" onclick="toggleBoxes()" title="show/hide OCR bounding boxes">▦ boxes</button>
      <button class="primary" id="verifyBtn" onclick="doVerify()">✓ Verify</button>
      <button id="unverifyBtn" onclick="doUnverify()">Unverify</button>
      <span id="msg"></span>
    </div>
    <div id="legend" style="margin-bottom:8px"></div>
    <div id="doc"><div id="notice" style="display:none"></div><div id="src"></div><div id="fields"></div></div>
  </div>
</div>
<script>
const COLORS={secured_creditor:"#fde68a",borrower:"#bbf7d0",contact:"#e9d5ff",property:"#fed7aa",
 full_description:"#cbd5e1",location:"#bfdbfe",identifier:"#fbcfe8",extent:"#a5f3fc",boundary:"#fecaca",
 schedule:"#ddd6fe",auction_terms:"#c7d2fe",outstanding:"#fef08a",emd_account:"#d9f99d",full_terms:"#e9d9c9"};
// Whole-block spans that overlap the granular ones; shown as fields, not painted
// in the source pane (the overlap-skip in render() would otherwise swallow the
// finer highlights inside them). full_description = a lot's property block;
// full_terms = the notice-level terms & conditions block (shared across lots).
const CONTAINER_CLASSES=new Set(["full_description","full_terms"]);
let CUR=null;
// Linking state: curFid = the focused field id (mark+card pair); PAINTED = the
// fids that actually got a <mark> this render, in document order — the prev/next
// list. noticeFor = filename currently shown in the #notice pane (so save/verify
// re-renders don't reload the image or reset its zoom).
let curFid=null,PAINTED=[],noticeFor=null;
// Bounding-box state (item 3): BLOCKS = the OCR/layout blocks for noticeFor;
// BLINK = fid→blockId map when the blocks faithfully reassemble to CUR.markdown
// (best-effort; empty when the markdown was edited/normalised). blocksFor tracks
// which filename BLOCKS belongs to so we fetch once per document.
let BLOCKS=[],BLINK={},blocksFor=null;
// API base set on window by the bootstrap above (?api= from review.html, else
// same-origin). Auth via the Supabase bearer token (window.Auth.fetchWithAuth),
// matching review.html — the API is token-based with CORS allow_credentials=false,
// so cookies (credentials:"include") would fail the cross-origin request outright.
const API_BASE=window.API_BASE||"";
const api=(p,o={})=>(window.Auth&&window.Auth.fetchWithAuth
  ? window.Auth.fetchWithAuth(API_BASE+p,o)
  : fetch(API_BASE+p,o));
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function setMsg(t){document.getElementById("msg").textContent=t;setTimeout(()=>document.getElementById("msg").textContent="",2500);}

// Replace the document pane with a full-width explanatory notice. Used for the
// empty / not-authed / errored states so the surface never just shows blank.
function mainNotice(html){
  document.getElementById("title").textContent="Extraction review";
  document.getElementById("status").innerHTML="";
  document.getElementById("legend").innerHTML="";
  document.getElementById("doc").innerHTML=
    '<div style="padding:22px 4px;color:#475569;font-size:13px;max-width:580px;line-height:1.65">'+html+'</div>';
}
async function loadQueue(){
  const nav=document.getElementById("nav");
  let r;
  try{ r=await api("/review/extraction/queue?limit=500"); }
  catch(err){
    nav.innerHTML="<div class=nav>couldn't reach server</div>";
    mainNotice("<b>Couldn't load the extraction queue.</b><br>The request failed (network error). Make sure the API is running and reachable, then reload.");
    return;
  }
  if(!r.ok){
    const auth=(r.status===401||r.status===403);
    nav.innerHTML="<div class=nav>load failed ("+r.status+")</div>";
    mainNotice(auth
      ? "<b>Admin login required.</b><br>The extraction queue is admin-only. Sign in as an admin and reload this page."
      : "<b>Couldn't load the extraction queue ("+r.status+").</b><br>Check the API logs and reload.");
    return;
  }
  const q=await r.json();nav.innerHTML="";
  if(!q.rows||!q.rows.length){
    nav.innerHTML="<div class=nav style='color:#94a3b8'>queue is empty</div>";
    mainNotice("<b>No extractions to review yet.</b><br>This queue lists documents that have grounded LangExtract output. None have been loaded into the graph so far.<br><br>Populate it by running the loader over documents that already have markdown:<br><br><code style='background:#0f172a;color:#e2e8f0;border-radius:6px;padding:8px 10px;display:inline-block;font-size:12px'>NEO4J_HTTP_API=1 LANGEXTRACT_PROVIDER=openrouter \\<br>&nbsp;&nbsp;python -m pipeline.load_extractions --limit 50</code><br><br>Then reload this page.");
    return;
  }
  q.rows.forEach(row=>{const e=document.createElement("div");e.className="nav";
    e.innerHTML=`<div>${esc(row.filename)}</div><div class=meta>${row.n_fields} fields · ${row.n_ungrounded} ungrounded · <span class="badge b-${row.status}">${row.status}</span></div>`;
    e.onclick=()=>loadDoc(row.filename,e);nav.appendChild(e);});
}
async function loadDoc(fn,el){
  [...document.querySelectorAll(".nav")].forEach(n=>n.classList.remove("active"));if(el)el.classList.add("active");
  const r=await api("/review/extraction/"+encodeURIComponent(fn));
  if(!r.ok){setMsg("load failed "+r.status);return;}
  CUR=await r.json();curFid=null;render();
  document.getElementById("src").scrollTop=0;document.getElementById("fields").scrollTop=0;
}
function render(){
  const d=CUR;
  document.getElementById("title").textContent=d.filename;
  document.getElementById("status").innerHTML=`<span class="badge b-${d.status}">${d.status}</span>`+
    (d.verified_by?` <span style="color:#64748b;font-size:12px">by ${esc(d.verified_by)}</span>`:"");
  const cls=[...new Set(d.fields.map(f=>f.cls))];
  document.getElementById("legend").innerHTML=cls.map(c=>`<span class=badge style="background:${COLORS[c]||'#e2e8f0'};color:#0f172a">${c}</span>`).join(" ");
  // keep pane scroll across save/verify re-renders (loadDoc zeroes it for new docs)
  const srcEl=document.getElementById("src"),fldEl=document.getElementById("fields");
  const st=[srcEl.scrollTop,fldEl.scrollTop];
  // highlighted source (container classes excluded so they don't swallow inner
  // spans); reduce to the non-overlapping set in document order — also the nav list.
  const sp=d.fields.filter(f=>f.start!=null&&!CONTAINER_CLASSES.has(f.cls)).map(f=>({s:f.start,e:f.end,c:f.cls,id:f.id})).sort((a,b)=>a.s-b.s);
  const md=d.markdown||"";const use=[];let upos=0;PAINTED=[];
  for(const x of sp){if(x.s<upos)continue;use.push(x);PAINTED.push(x.id);upos=x.e;}
  const rendered=mdMode()==="rendered"&&!!window.marked&&!!window.DOMPurify;
  srcEl.classList.toggle("rendered",rendered);
  srcEl.innerHTML=srcHtml(md,use,rendered);
  // editable fields — <textarea> (not <input>) so long values wrap and autosize
  let f="";
  d.fields.forEach(fl=>{
    const ung=fl.grounded?"":" <span class=ung>UNGROUNDED</span>";
    const attrs=Object.entries(fl.attrs).map(([k,v])=>`<b>${esc(k)}</b>: ${esc(String(v))}`).join(" · ");
    const val=esc(fl.corrected_value!=null?fl.corrected_value:fl.text);
    f+=`<div class="fld" id="fld_${fl.id}" data-fid="${fl.id}"><div class="c">${fl.cls}${fl.lot_index?(" · lot "+fl.lot_index):""}${ung}</div>
      <div style="background:${COLORS[fl.cls]||'#f1f5f9'};display:inline-block;border-radius:3px;padding:0 3px;margin-bottom:4px">${esc(fl.text.slice(0,90))}</div>
      ${attrs?`<div style="color:#334155;font-size:12px;margin-bottom:4px">${attrs}</div>`:""}
      <textarea id="in_${fl.id}" rows="1">${val}</textarea>
      <button class="save" onclick="saveField('${fl.id}')">Save correction</button>
      ${fl.corrected_value!=null?`<div class=corr>✓ corrected by ${esc(fl.corrected_by||"")}</div>`:""}
    </div>`;
  });
  fldEl.innerHTML=f;
  fldEl.querySelectorAll("textarea").forEach(autosize);
  srcEl.scrollTop=st[0];fldEl.scrollTop=st[1];
  // re-apply the active pair (no scrolling) so corrections don't lose your place
  if(curFid!=null&&document.getElementById("fld_"+curFid))setCur(curFid,{});
  else{curFid=null;updatePos();}
  applyImgPane();
}
// ── markdown rendering (item 2) ──────────────────────────────────────────────
// Default rendered so the embedded HTML tables show as tables; "raw" shows the
// unrendered OCR text. Persisted per reviewer.
const mdMode=()=>localStorage.getItem("xr_md")==="raw"?"raw":"rendered";
function refreshMdBtn(){const b=document.getElementById("mdBtn");if(b)b.textContent=mdMode()==="raw"?"✦ raw":"✦ rendered";}
function toggleMdMode(){localStorage.setItem("xr_md",mdMode()==="raw"?"rendered":"raw");refreshMdBtn();if(CUR)render();}
// Build the #src innerHTML for the non-overlapping span set `use`.
//  rendered: sentinel-inject each span into the RAW markdown at its char offsets,
//            render via marked, sanitize, then swap sentinels → per-field <mark>.
//            (review.html's technique — the offsets survive because the sentinels
//            are plain private-use chars that ride through the renderer.) Breaking
//            each region on \n stops a mark straddling a table row.
//  raw:      the original escaped-slice highlighter (also the automatic fallback
//            when marked/DOMPurify didn't load).
function srcHtml(md,use,rendered){
  if(rendered){
    // U+E000/E001/E002 private-use sentinels (written as \u escapes so the
    // source stays ASCII): invisible plain text that rides through marked+
    // DOMPurify untouched, so char offsets survive rendering. The E000..E002
    // bracket around the span index can't collide with digits in the notice.
    const M0="\ue000",M1="\ue001",M2="\ue002",OPEN=i=>M0+i+M2;
    let s=md;
    for(let i=use.length-1;i>=0;i--){const x=use[i];
      const a=Math.max(0,Math.min(x.s,s.length)),b=Math.max(a,Math.min(x.e,s.length));
      const region=s.slice(a,b).split("\n").join(M1+"\n"+OPEN(i));
      s=s.slice(0,a)+OPEN(i)+region+M1+s.slice(b);}
    let html=window.DOMPurify.sanitize(window.marked.parse(s,{gfm:true,breaks:false}));
    const reOpen=new RegExp(M0+"(\\d+)"+M2,"g");
    return html.replace(reOpen,(m,n)=>{const x=use[+n];
        return `<mark data-fid="${x.id}" style="background:${COLORS[x.c]||'#e2e8f0'}" title="${x.c}">`;})
      .split(M1).join("</mark>");
  }
  let out="",pos=0;
  for(const x of use){out+=esc(md.slice(pos,x.s));
    out+=`<mark data-fid="${x.id}" style="background:${COLORS[x.c]||'#e2e8f0'}" title="${x.c}">${esc(md.slice(x.s,x.e))}</mark>`;pos=x.e;}
  return out+esc(md.slice(pos));
}
// autosize a textarea to its content (no library; grows on input via delegation)
function autosize(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}
document.addEventListener("input",e=>{if(e.target.matches("#fields textarea"))autosize(e.target);});
// ── highlight ↔ card linking + prev/next (langextract-style review nav) ──────
function updatePos(){const i=PAINTED.indexOf(curFid);
  document.getElementById("pos").textContent=(i<0?"–":i+1)+" / "+PAINTED.length;}
// scroll: {mark:bool,card:bool} — {} re-applies emphasis only (post-re-render)
function setCur(fid,scroll){
  document.querySelectorAll(".cur").forEach(el=>el.classList.remove("cur"));
  curFid=fid;
  // a field can now paint several <mark> fragments (rendered mode breaks them at
  // newlines), so match all of them by data-fid; the card id is still unique.
  const marks=document.querySelectorAll('#src [data-fid="'+fid+'"]');
  marks.forEach(m=>m.classList.add("cur"));
  const fl=document.getElementById("fld_"+fid);
  if(fl)fl.classList.add("cur");
  const bx=BLINK[fid]?document.getElementById("bx_"+BLINK[fid]):null;  // mapped notice box, if any
  if(bx)bx.classList.add("cur");
  if(scroll.mark&&marks[0])marks[0].scrollIntoView({block:"center",behavior:"smooth"});
  if(scroll.card&&fl)fl.scrollIntoView({block:"center",behavior:"smooth"});
  if((scroll.mark||scroll.card)&&bx&&!boxesHidden())bx.scrollIntoView({block:"nearest"});
  updatePos();}
function nav(step){if(!PAINTED.length)return;
  let i=PAINTED.indexOf(curFid);
  i=i<0?(step>0?0:PAINTED.length-1):(i+step+PAINTED.length)%PAINTED.length;
  setCur(PAINTED[i],{mark:true,card:true});}
// Delegated on document so the handlers survive innerHTML swaps and mainNotice().
document.addEventListener("click",e=>{
  const bx=e.target.closest("#notice .bbx.link");
  if(bx&&bx.dataset.fid){setCur(bx.dataset.fid,{mark:true,card:true});return;} // box → drive selection
  const m=e.target.closest("#src mark[data-fid]");
  if(m){setCur(m.dataset.fid,{card:true});return;}          // mark → align card
  if(e.target.closest("#fields input,#fields textarea,#fields button"))return; // don't hijack edits
  const c=e.target.closest("#fields .fld[data-fid]");
  if(c)setCur(c.dataset.fid,{mark:true});});                 // card → align mark
document.addEventListener("keydown",e=>{
  if(!CUR||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))return;
  if(e.key==="ArrowRight"){e.preventDefault();nav(1);}
  else if(e.key==="ArrowLeft"){e.preventDefault();nav(-1);}});
// ── source-notice pane ───────────────────────────────────────────────────────
// Images load from the R2 public bucket (Document.public_url) with a one-shot
// onerror fallback to the API's self-healing CORS proxy; PDFs always go through
// the proxy (R2 sends no CORS headers, which pdf.js's XHR needs). NOTE: the
// Vercel CSP img-src whitelists the Render API host — if API_BASE ever moves
// (e.g. to api.auctionscope.in), vercel.json img-src must follow.
const proxyUrl=fn=>API_BASE+"/review/notice/"+encodeURIComponent(fn)+"/source";
const imgPaneOn=()=>localStorage.getItem("xr_img")!=="0";
function toggleImgPane(){localStorage.setItem("xr_img",imgPaneOn()?"0":"1");applyImgPane();}
function applyImgPane(){
  const n=document.getElementById("notice");if(!n)return;
  const on=imgPaneOn()&&!!CUR;
  n.style.display=on?"":"none";
  document.getElementById("imgBtn").textContent=imgPaneOn()?"🖼 hide notice":"🖼 show notice";
  if(on&&noticeFor!==CUR.filename)loadNotice();}
function loadNotice(){
  const n=document.getElementById("notice");if(!n||!CUR)return;
  const fn=noticeFor=CUR.filename;
  BLOCKS=[];BLINK={};blocksFor=null;refreshBoxBtn();        // new doc → drop stale boxes
  const isPdf=(CUR.content_type||"").includes("pdf")||CUR.doc_type==="pdf"||/\.pdf$/i.test(fn);
  const open=`<div style="text-align:right;margin-bottom:4px"><a href="${esc(CUR.public_url||proxyUrl(fn))}" target="_blank" rel="noopener" style="font-size:11px">open ↗</a></div>`;
  if(isPdf){
    n.innerHTML=open+'<div id="pdfbox" style="color:#64748b;font-size:12px">loading pdf…</div>';
    renderPdf(n.querySelector("#pdfbox"),proxyUrl(fn))
      .then(()=>{if(noticeFor===fn)ensureBlocks(fn);})
      .catch(()=>{const b=n.querySelector("#pdfbox");
        if(noticeFor===fn&&b)b.textContent="pdf load failed — use open ↗";});
    return;}
  n.innerHTML=open;
  // img + absolutely-positioned box overlay in one relatively-positioned wrapper;
  // zoom toggles the wrapper (not the img) so the %-positioned boxes track it.
  const wrap=document.createElement("div");wrap.className="imgwrap";
  const img=new Image();img.alt="sale notice";
  img.onerror=()=>{
    if(noticeFor!==fn)return;
    if(!img.dataset.p){img.dataset.p="1";img.src=proxyUrl(fn);return;}
    wrap.remove();
    n.insertAdjacentHTML("beforeend",'<div style="color:#991b1b;font-size:12px;padding:8px">no source image (missing on R2 and via proxy)</div>');};
  img.onclick=()=>wrap.classList.toggle("zoom");
  const ovl=document.createElement("div");ovl.className="ovl"+(boxesHidden()?" boxes-hidden":"");ovl.dataset.page="1";
  wrap.appendChild(img);wrap.appendChild(ovl);n.appendChild(wrap);
  img.src=CUR.public_url||proxyUrl(fn);
  ensureBlocks(fn);}
async function ensurePdfJs(){ // review.html idiom: legacy UMD build + explicit worker
  if(window.pdfjsLib)return;
  await new Promise((res,rej)=>{const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
    s.onload=res;s.onerror=rej;document.head.appendChild(s);});
  if(!window.pdfjsLib)throw new Error("pdf.js failed to load");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";}
async function renderPdf(box,url){
  await ensurePdfJs();
  const doc=await pdfjsLib.getDocument(url).promise;
  if(!box.isConnected)return; // reviewer switched docs mid-load
  box.innerHTML="";
  const pages=Math.min(doc.numPages,5);
  for(let i=1;i<=pages;i++){
    const page=await doc.getPage(i),vp=page.getViewport({scale:1.5});
    const pw=document.createElement("div");pw.className="pagewrap";
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    const ovl=document.createElement("div");ovl.className="ovl"+(boxesHidden()?" boxes-hidden":"");ovl.dataset.page=i;
    pw.appendChild(c);pw.appendChild(ovl);box.appendChild(pw);
    await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;}
  if(doc.numPages>pages)box.insertAdjacentHTML("beforeend",
    `<div style="color:#64748b;font-size:12px">+${doc.numPages-pages} more pages — use open ↗</div>`);}
// ── OCR bounding boxes (item 3) ──────────────────────────────────────────────
// Boxes come from the same MinerU/annotator data the block editor uses
// (GET /review/notice/{fn}/blocks): normalized [x0,y0,x1,y1] per page, so they
// place as CSS % over the notice and auto-scale — no natural/displayed math.
const boxesHidden=()=>localStorage.getItem("xr_box")==="0";
function refreshBoxBtn(){const b=document.getElementById("boxBtn");if(!b)return;
  if(blocksFor&&!BLOCKS.length){b.textContent="▦ no boxes";b.disabled=true;b.title="no OCR layout data for this document";return;}
  b.disabled=false;b.title="show/hide OCR bounding boxes";
  b.textContent=boxesHidden()?"▦ show boxes":"▦ hide boxes";}
function toggleBoxes(){localStorage.setItem("xr_box",boxesHidden()?"1":"0");
  document.querySelectorAll("#notice .ovl").forEach(o=>o.classList.toggle("boxes-hidden",boxesHidden()));
  refreshBoxBtn();}
async function ensureBlocks(fn){
  if(blocksFor!==fn){
    blocksFor=fn;BLOCKS=[];BLINK={};
    try{
      const r=await api("/review/notice/"+encodeURIComponent(fn)+"/blocks");
      if(noticeFor!==fn)return;                 // reviewer switched docs mid-fetch
      if(r.ok){const d=await r.json();
        if(!d.backfill_required&&Array.isArray(d.blocks))BLOCKS=d.blocks;}
    }catch(_){/* leave BLOCKS empty → generic "no boxes" */}
    if(noticeFor!==fn)return;
    BLINK=computeBlockLink(BLOCKS,(CUR&&CUR.markdown)||"");
  }
  paintBoxes();refreshBoxBtn();
}
// Best-effort field→box map: replay pipeline/mineru.py assemble_markdown and, only
// if it reproduces CUR.markdown exactly, map each grounded field's start offset to
// the block whose reassembled span contains it. A mismatch (edited/normalised
// markdown) yields {} — boxes then show generically, never wrongly.
function computeBlockLink(blocks,markdown){
  if(!blocks.length||!markdown)return {};
  const skip={Discarded:1,PageNumber:1};
  const ordered=blocks.filter(b=>!skip[b.label]).slice()
    .sort((a,b)=>((a.reading_order||0)-(b.reading_order||0))||((a.page||0)-(b.page||0)));
  let asm="";const spans=[];
  for(const b of ordered){
    let t=(b.text||"").trim();if(!t)continue;
    if(b.label==="Title"&&!t.replace(/^\s+/,"").startsWith("#"))t="# "+t;
    if(asm)asm+="\n\n";
    const s=asm.length;asm+=t;spans.push({id:b.id,s,e:asm.length});}
  if(asm!==markdown)return {};
  const link={};
  if(CUR&&CUR.fields)for(const fl of CUR.fields){
    if(fl.start==null)continue;
    const blk=spans.find(sp=>fl.start>=sp.s&&fl.start<sp.e);
    if(blk)link[fl.id]=blk.id;}
  return link;
}
function paintBoxes(){
  const n=document.getElementById("notice");if(!n)return;
  const rev={};for(const fid in BLINK)rev[BLINK[fid]]=fid;   // blockId → fid
  n.querySelectorAll(".ovl").forEach(ovl=>{
    const pg=+ovl.dataset.page||1;ovl.innerHTML="";
    for(const b of BLOCKS){
      if((b.page||1)!==pg)continue;
      const bb=b.bbox||[];if(bb.length<4)continue;
      const fid=rev[b.id];
      const el=document.createElement("div");
      el.className="bbx"+(fid?" link":"");el.id="bx_"+b.id;
      if(fid){el.dataset.fid=fid;if(fid===curFid)el.classList.add("cur");}
      el.style.left=(bb[0]*100)+"%";el.style.top=(bb[1]*100)+"%";
      el.style.width=((bb[2]-bb[0])*100)+"%";el.style.height=((bb[3]-bb[1])*100)+"%";
      el.innerHTML=`<span class="bbl">${esc((b.reading_order!=null?b.reading_order+" · ":"")+(b.label||"Text"))}</span>`;
      ovl.appendChild(el);}
  });
}
async function saveField(id){
  const v=document.getElementById("in_"+id).value;
  const r=await api(`/review/extraction/${encodeURIComponent(CUR.filename)}/field`,
    {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({field_id:id,value:v})});
  if(r.ok){CUR=await r.json();render();setMsg("saved");}else setMsg("save failed "+r.status);
}

  if(r.ok){CUR=await r.json();render();loadQueue();setMsg("unverified");}else setMsg("failed "+r.status);
}
refreshMdBtn();refreshBoxBtn();loadQueue();applyImgPane();
