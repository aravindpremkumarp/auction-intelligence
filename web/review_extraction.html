<!doctype html>
<meta charset="utf-8">
<title>Extraction review</title>
<!--
  Editable grounded review surface for LangExtract output.
  Three panes: original notice (image/pdf, via R2 public_url or the API's
  /review/notice/{f}/source proxy) | highlighted markdown | editable fields.
  Marks and cards share data-fid, so clicking either aligns the other, and the
  ◀ ▶ bar buttons / arrow keys step through the highlights langextract-style.
  Talks to the admin-gated /review/extraction/* endpoints (api/review/extraction.py).
  Embedded as a same-origin iframe by web/review.html (the "extraction" stage pill).
  Auth: the API is bearer-token (Supabase), CORS allow_credentials=False — NOT cookies.
  We load the Supabase SDK + /auth.js and call window.Auth.fetchWithAuth, exactly like
  review.html. The iframe shares localStorage with the parent, so the admin's session
  is already present; no separate login needed.
-->
<script>
  // API base arrives via ?api= when review.html embeds us; fall back to same-origin.
  // Supabase env mirrors review.html so /auth.js can read the shared session.
  window.API_BASE = new URLSearchParams(location.search).get("api") || "";
  window.SUPABASE_URL = window.SUPABASE_URL || 'https://yrcrxpwoqddfcengkryw.supabase.co';
  window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_IT4CBVWS1a37sduWApOdFw_1UCR0kyJ';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- Rendered-markdown mode (item 2): marked turns the OCR markdown — which
     contains real embedded <table> HTML — into a rendered table, DOMPurify
     sanitizes it. Same versions review.html ships; both are CSP-allowed by the
     /review_extraction(.html)? block in vercel.json. If either fails to load,
     render() falls back to the raw escaped view, so the page still works. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
<!-- KaTeX renders LaTeX math in the OCR markdown (e.g. extents like
     "742 $\frac{1}{2}$ sq ft") as real fractions. Same version review.html ships;
     CSS/JS/woff2 all load from cdn.jsdelivr.net, already CSP-allowed for this
     route. Optional: renderMathIn() no-ops if auto-render didn't load. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script src="/auth.js"></script>
<style>

 #qhead .lbl{color:#64748b;font-size:11px}
 #qhint{color:#4ade80;font-size:10px;font-weight:700;margin-left:auto}

 #sortBtn:hover{background:#334155;color:#fff}

 .fld .prev ul,.fld .prev ol{margin:4px 0 4px 18px;padding:0}
 .fld .prev img{max-width:100%;height:auto}
 .ung{background:#fee2e2;color:#991b1b;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700}
 /* The span under this field was re-found by us, not returned by the
    extraction (api/review/grounding.py). Amber, not red: the value is sound,
    only its location is a reconstruction — and a fuzzy one is the reviewer's

 .anch{background:#fef3c7;color:#92400e;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700}
 .corr{color:#16a34a;font-size:11px;margin-top:3px}
 mark{border-radius:3px;padding:0 1px}
 #msg{font-size:12px;color:#64748b}
 /* source-notice pane + highlight↔card linking */
 #notice{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px;max-height:84vh;overflow:auto}
 #notice .imgwrap img{cursor:zoom-in}
 #notice .imgwrap.zoom img{cursor:zoom-out}
 #notice canvas{width:100%;height:auto;display:block}
 #notice .pagewrap{position:relative;display:block;margin-bottom:6px}
 mark[data-fid]{cursor:pointer}
 .fld{cursor:pointer}.fld textarea{cursor:text}
 mark.cur,.fld.cur{outline:2px solid #2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.25)}
 mark{scroll-margin:90px}.fld{scroll-margin:24px}
 #pos{font-size:12px;color:#64748b;min-width:52px;text-align:center}
 .navbtn{padding:6px 8px}
 /* rendered-markdown mode (item 2): tables + block spacing, mirroring review.html */
 #src.rendered{white-space:normal}
 #src.rendered table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px;background:#fff}
 #src.rendered th,#src.rendered td{border:1px solid #cbd5e1;padding:6px 8px;vertical-align:top;text-align:left}
 #src.rendered th{background:#f1f5f9;font-weight:600}
 #src.rendered p{margin:6px 0}#src.rendered h1,#src.rendered h2,#src.rendered h3{margin:10px 0 4px;font-size:15px}

 #src.rendered code{background:#f1f5f9;padding:1px 4px;border-radius:3px}

 .bbl{position:absolute;top:-13px;left:0;font-size:9px;line-height:1.3;color:#1e40af;background:#fff;padding:0 3px;border-radius:2px;white-space:nowrap;pointer-events:none}
</style>
<div id="wrap">
  <div id="side">
    <h2>Extraction queue</h2>
    <div id="qhead">
      <span class="lbl">sort</span>
      <button id="sortBtn" onclick="toggleQueueSort()" title="toggle between newest-extracted and A–Z"></button>

             title="minimum quality score (pipeline/validators.py)">

      <button id="imgBtn" onclick="toggleImgPane()">🖼 notice</button>
      <button id="boxBtn" onclick="toggleBoxes()" title="show/hide OCR bounding boxes">▦ boxes</button>
      <button class="primary" id="verifyBtn" onclick="doVerify()">✓ Verify</button>
      <button id="unverifyBtn" onclick="doUnverify()">Unverify</button>
      <button id="rerunBtn" onclick="doRerun()" title="Re-run LangExtract on the current markdown — use after fixing the markdown via re-ingest or block re-OCR">▶ Re-run LangExtract</button>
      <span id="msg"></span>
    </div>

<script>
const COLORS={secured_creditor:"#fde68a",borrower:"#bbf7d0",contact:"#e9d5ff",property:"#fed7aa",
 full_description:"#cbd5e1",location:"#bfdbfe",identifier:"#fbcfe8",extent:"#a5f3fc",boundary:"#fecaca",
 schedule:"#ddd6fe",auction_terms:"#c7d2fe",outstanding:"#fef08a",emd_account:"#d9f99d",full_terms:"#e9d9c9"};
// Whole-block spans that overlap the granular ones; shown as fields, not painted
// in the source pane (the overlap-skip in render() would otherwise swallow the
// finer highlights inside them). full_description = a lot's property block;
// full_terms = the notice-level terms & conditions block (shared across lots).
const CONTAINER_CLASSES=new Set(["full_description","full_terms"]);
let CUR=null;
// Linking state: curFid = the focused field id (mark+card pair); PAINTED = the
// fids that actually got a <mark> this render, in document order — the prev/next
// list. noticeFor = filename currently shown in the #notice pane (so save/verify
// re-renders don't reload the image or reset its zoom).
let curFid=null,PAINTED=[],noticeFor=null;
// Bounding-box state (item 3): BLOCKS = the OCR/layout blocks for noticeFor;
// BLINK = fid→blockId map when the blocks faithfully reassemble to CUR.markdown
// (best-effort; empty when the markdown was edited/normalised). blocksFor tracks
// which filename BLOCKS belongs to so we fetch once per document.
let BLOCKS=[],BLINK={},blocksFor=null;
// API base set on window by the bootstrap above (?api= from review.html, else
// same-origin). Auth via the Supabase bearer token (window.Auth.fetchWithAuth),
// matching review.html — the API is token-based with CORS allow_credentials=false,
// so cookies (credentials:"include") would fail the cross-origin request outright.
const API_BASE=window.API_BASE||"";
const api=(p,o={})=>(window.Auth&&window.Auth.fetchWithAuth
  ? window.Auth.fetchWithAuth(API_BASE+p,o)
  : fetch(API_BASE+p,o));
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function setMsg(t){document.getElementById("msg").textContent=t;setTimeout(()=>document.getElementById("msg").textContent="",2500);}

// Replace the document pane with a full-width explanatory notice. Used for the
// empty / not-authed / errored states so the surface never just shows blank.
function mainNotice(html){
  document.getElementById("title").textContent="Extraction review";
  document.getElementById("status").innerHTML="";
  document.getElementById("legend").innerHTML="";
  document.getElementById("doc").innerHTML=
    '<div style="padding:22px 4px;color:#475569;font-size:13px;max-width:580px;line-height:1.65">'+html+'</div>';
}
// Queue sort: "recent" (newest extraction first — a just-run batch clusters at
// the top) or "name" (A–Z). Persisted per reviewer; drives the ?sort= param.
const queueSort=()=>localStorage.getItem("xr_sort")==="name"?"name":"recent";
function refreshSortBtn(){const b=document.getElementById("sortBtn");if(b)b.textContent=queueSort()==="name"?"A–Z":"newest";}
function toggleQueueSort(){localStorage.setItem("xr_sort",queueSort()==="name"?"recent":"name");refreshSortBtn();loadQueue();}
// Score filter (pipeline/validators.py score, 0-100): persisted per reviewer,
// drives score_min/score_max on the queue fetch. Empty = unbounded.
function scoreMin(){const v=localStorage.getItem("xr_score_min");return v===null?null:Number(v);}
function scoreMax(){const v=localStorage.getItem("xr_score_max");return v===null?null:Number(v);}
function refreshScoreInputs(){
  const mn=document.getElementById("scoreMin"),mx=document.getElementById("scoreMax");
  if(mn)mn.value=scoreMin()===null?"":String(scoreMin());
  if(mx)mx.value=scoreMax()===null?"":String(scoreMax());
}
function applyScoreFilter(){
  const mn=document.getElementById("scoreMin").value.trim(),mx=document.getElementById("scoreMax").value.trim();
  if(mn==="")localStorage.removeItem("xr_score_min");else localStorage.setItem("xr_score_min",String(Math.max(0,Math.min(100,+mn))));
  if(mx==="")localStorage.removeItem("xr_score_max");else localStorage.setItem("xr_score_max",String(Math.max(0,Math.min(100,+mx))));
  loadQueue();
}
function clearScoreFilter(){localStorage.removeItem("xr_score_min");localStorage.removeItem("xr_score_max");refreshScoreInputs();loadQueue();}
// Score badge classes: >=80 green (the extract_batch.py review threshold), 50-79
// amber, <50 red. null/undefined (pre-scoring rows) -> no badge.
function scoreBadge(s){
  if(s==null)return "";
  const cls=s>=80?"sc-hi":s>=50?"sc-mid":"sc-lo";
  return ` <span class="sc ${cls}" title="extraction quality score">${s}</span>`;
}
// Compact "3m ago" / "2h ago" / "5d ago" for an ISO extraction timestamp.
function relTime(iso){
  if(!iso)return "";
  const t=Date.parse(iso);if(isNaN(t))return "";
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<60)return "just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  if(s<2592000)return Math.floor(s/86400)+"d ago";
  return new Date(t).toLocaleDateString();
}
// Filters owned by the parent review.html shell (status / score / notice type /
// auction date / search), handed down on this frame's query string. When the
// parent is driving, the sidebar's own score box is hidden so there is exactly
// one place to filter — see PARENT_FILTERS wiring at the bottom of this file.
const PARENT_QS = new URLSearchParams(location.search);
const PARENT_KEYS = ["status", "score_min", "score_max", "notice_type",
                     "date_from", "date_to", "q"];
const PARENT_DRIVEN = PARENT_QS.get("embedded") === "1";
// ?doc=<filename> — render ONE notice; the parent shell owns the queue.
const SINGLE_DOC = PARENT_QS.get("doc") || "";
function parentFilterQS(){
  let s = "";
  for (const k of PARENT_KEYS){
    const v = PARENT_QS.get(k);
    if (v !== null && v !== "" && v !== "all") s += "&" + k + "=" + encodeURIComponent(v);
  }
  return s;
}

async function loadQueue(){
  // Single-doc mode: the parent shell owns the queue, so the post-action
  // refresh calls scattered through this file (verify / unverify / field save)
  // have nothing to repaint here. Returning to the queue re-fetches the card
  // list in the parent, so state is never stale.
  if(SINGLE_DOC)return;
  refreshSortBtn();refreshScoreInputs();
  const nav=document.getElementById("nav");
  let qs="/review/extraction/queue?limit=500&sort="+queueSort();
  if(PARENT_DRIVEN){
    qs+=parentFilterQS();
  }else{
    if(scoreMin()!==null)qs+="&score_min="+scoreMin();
    if(scoreMax()!==null)qs+="&score_max="+scoreMax();
  }
  let r;
  try{ r=await api(qs); }
  catch(err){
    nav.innerHTML="<div class=nav>couldn't reach server</div>";
    mainNotice("<b>Couldn't load the extraction queue.</b><br>The request failed (network error). Make sure the API is running and reachable, then reload.");
    return;
  }
  if(!r.ok){
    const auth=(r.status===401||r.status===403);
    nav.innerHTML="<div class=nav>load failed ("+r.status+")</div>";
    mainNotice(auth
      ? "<b>Admin login required.</b><br>The extraction queue is admin-only. Sign in as an admin and reload this page."
      : "<b>Couldn't load the extraction queue ("+r.status+").</b><br>Check the API logs and reload.");
    return;
  }
  const q=await r.json();nav.innerHTML="";
  const filtered=scoreMin()!==null||scoreMax()!==null;
  if(!q.rows||!q.rows.length){
    nav.innerHTML="<div class=nav style='color:#94a3b8'>queue is empty</div>";
    mainNotice(filtered
      ? "<b>No extractions in that score range.</b><br>Widen or clear the score filter in the sidebar."
      : "<b>No extractions to review yet.</b><br>This queue lists documents that have grounded LangExtract output. None have been loaded into the graph so far.<br><br>Populate it by running the loader over documents that already have markdown:<br><br><code style='background:#0f172a;color:#e2e8f0;border-radius:6px;padding:8px 10px;display:inline-block;font-size:12px'>NEO4J_HTTP_API=1 LANGEXTRACT_PROVIDER=openrouter \\<br>&nbsp;&nbsp;python -m pipeline.load_extractions --limit 50</code><br><br>Then reload this page.");
    return;
  }
  // Latest run detection. Each load_extractions.py invocation stamps a batch
  // number (B1, B2, …); the highest one present is the newest run, so every row
  // in it gets the "B7" tag highlighted green + a green rail — that's the batch
  // you just extracted. Fallback for rows predating batches: a 10-min window
  // around the newest extraction_at, so older data still clusters sensibly.
  const batches=q.rows.map(row=>row.extraction_batch).filter(b=>b!=null);
  const maxBatch=batches.length?Math.max(...batches):null;
  const times=q.rows.map(row=>row.extraction_at?Date.parse(row.extraction_at):NaN).filter(t=>!isNaN(t));
  const maxT=times.length?Math.max(...times):NaN;
  const freshCount=maxBatch!=null?q.rows.filter(row=>row.extraction_batch===maxBatch).length:0;
  const hint=document.getElementById("qhint");
  if(hint)hint.textContent=maxBatch!=null?`latest B${maxBatch} · ${freshCount} doc${freshCount===1?"":"s"}`:"";
  q.rows.forEach(row=>{const e=document.createElement("div");e.className="nav";
    const isLatest=maxBatch!=null&&row.extraction_batch===maxBatch;
    const t=row.extraction_at?Date.parse(row.extraction_at):NaN;
    // green rail: latest batch when batches exist, else the time-window fallback
    if(isLatest||(maxBatch==null&&!isNaN(t)&&!isNaN(maxT)&&(maxT-t)<=600000))e.classList.add("fresh");
    const tag=row.extraction_batch!=null?`<span class="btag${isLatest?" latest":""}" title="extraction batch ${row.extraction_batch}">B${row.extraction_batch}</span>`:"";
    const when=relTime(row.extraction_at);
    const staleTag=row.stale?` · <span class="badge" style="background:#f59e0b;color:#0f172a" title="Markdown re-ingested after this extraction — re-run required">⚠ re-run</span>`:"";
    const lotTag=row.lot_count_mismatch
      ?` · <span class="badge" style="background:#ef4444;color:#fff" title="Reviewer counted ${row.expected_lot_count} lot(s) at classification; this extraction has ${row.extracted_lot_count}">⚠ lots ${row.extracted_lot_count}/${row.expected_lot_count}</span>`
      :(row.expected_lot_count!=null&&row.extracted_lot_count!=null
        ?` · <span class="badge" style="background:#16a34a;color:#fff" title="Extracted lot count matches the reviewer's count">✓ ${row.extracted_lot_count} lot${row.extracted_lot_count===1?"":"s"}</span>`
        :"");

      el.style.width=((bb[2]-bb[0])*100)+"%";el.style.height=((bb[3]-bb[1])*100)+"%";
      el.innerHTML=`<span class="bbl">${esc((b.reading_order!=null?b.reading_order+" · ":"")+(b.label||"Text"))}</span>`;
      ovl.appendChild(el);}
  });
}
async function saveField(id){
  const v=document.getElementById("in_"+id).value;
  const r=await api(`/review/extraction/${encodeURIComponent(CUR.filename)}/field`,
    {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({field_id:id,value:v})});
  // back to the rendered view on success, so the saved value is shown as a table
  if(r.ok){CUR=await r.json();EDITING.delete(String(id));render();setMsg("saved");}else setMsg("save failed "+r.status);
}
async function doVerify(){
  const r=await api(`/review/extraction/${encodeURIComponent(CUR.filename)}/verify`,
    {method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({})});
  if(r.ok){CUR=await r.json();render();loadQueue();setMsg("verified");}else setMsg("verify failed "+r.status);
}
async function doUnverify(){
  const r=await api(`/review/extraction/${encodeURIComponent(CUR.filename)}/unverify`,{method:"POST"});
  if(r.ok){CUR=await r.json();render();loadQueue();setMsg("unverified");}else setMsg("failed "+r.status);
}
let RERUN_POLL=null;
async function doRerun(){
  if(!confirm("Re-run LangExtract on the current markdown?\nThis replaces the stored fields (reviewer field corrections are kept but may no longer line up)."))return;
  const r=await api(`/review/extraction/${encodeURIComponent(CUR.filename)}/rerun`,{method:"POST"});
  if(r.ok){CUR=await r.json();render();setMsg("LangExtract started — this takes a minute or two");}
  else if(r.status===409){setMsg("a re-run is already in progress");}
  else setMsg("re-run failed to start "+r.status);
}
// Two embedded modes, both driven by the parent review shell:
//   ?doc=<filename>  — ONE notice. The parent owns the queue (a card list, like
//                      the markdown stage), so the sidebar is removed entirely
//                      and this frame is purely the grounded-review workspace.
//   ?embedded=1      — parent owns the filter bar; hide the duplicate score box.
refreshMdBtn();refreshBoxBtn();refreshScoreInputs();applyImgPane();
if(SINGLE_DOC){
  const side=document.getElementById("side");
  if(side)side.style.display="none";
  loadDoc(SINGLE_DOC,null);
}else{
  if(PARENT_DRIVEN){
    const f=document.getElementById("qfilter");
    if(f)f.style.display="none";
    const h=document.querySelector("#side h2");
    if(h)h.title="filters are in the toolbar above";
  }
  loadQueue();
}
</script>
