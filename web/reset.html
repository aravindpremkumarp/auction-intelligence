<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password · Bank Auction Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  window.API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? ''
    : 'https://auction-api-w68b.onrender.com';
</script>
<style>
  :root { --ink: #1a1a1a; --paper: #faf7f0; --accent: #ffd84d; --danger: #d64a2e; --good: #2e8b57; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Kalam', cursive; display: grid; place-items: center; min-height: 100vh; }
  .card { background: #fff; border: 2px solid var(--ink); box-shadow: 2px 3px 0 rgba(0,0,0,0.9); padding: 24px 28px; max-width: 460px; width: 92%; }
  h1 { font-family: 'Caveat', cursive; font-size: 32px; margin: 0 0 10px; }
  h1 em { background: var(--accent); padding: 0 6px; font-style: normal; }
  label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 10px; }
  input { width: 100%; padding: 8px 10px; border: 2px solid var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 13px; background: #fff; color: var(--ink); }
  button { margin-top: 14px; padding: 9px 16px; background: var(--accent); border: 2px solid var(--ink); color: var(--ink); font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; box-shadow: 2px 3px 0 rgba(0,0,0,0.9); cursor: pointer; }
  p.msg { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin: 10px 0 0; }
  .ok { color: var(--good); font-weight: 600; }
  .err { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1><em>Reset</em> password</h1>
  <form id="f">
    <label for="pw">New password (8+ chars, letter + digit)</label>
    <input id="pw" name="pw" type="password" autocomplete="new-password" required minlength="8">
    <button type="submit">Update password</button>
    <p id="msg" class="msg"></p>
  </form>
</div>
<script>
  const qs = new URLSearchParams(location.search);
  const token = qs.get('token') || '';
  const form = document.getElementById('f');
  const msg = document.getElementById('msg');
  if (!token) { msg.innerHTML = '<span class="err">No token provided.</span>'; form.style.display = 'none'; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    const pw = document.getElementById('pw').value;
    try {
      const r = await fetch(window.API_BASE + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: pw }),
      });
      if (r.status === 204) {
        msg.innerHTML = '<span class="ok">Password updated.</span> You can now sign in.';
        form.querySelector('button').disabled = true;
      } else {
        const j = await r.json().catch(() => ({}));
        msg.innerHTML = '<span class="err">Failed:</span> ' + (j.detail || 'Try a new reset link.');
      }
    } catch (_) {
      msg.innerHTML = '<span class="err">Network error.</span>';
    }
  });
</script>
</body>
</html>
