<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social · content review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  window.API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? ''
    : 'https://auction-api-w68b.onrender.com';
  window.SUPABASE_URL = window.SUPABASE_URL || 'https://yrcrxpwoqddfcengkryw.supabase.co';
  window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_IT4CBVWS1a37sduWApOdFw_1UCR0kyJ';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/auth.js"></script>
<style>
  :root { --ink: #1a1a1a; --paper: #faf7f0; --accent: #ffd84d; --danger: #d64a2e; --good: #2e8b57; --muted: #8a8a8a; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Kalam', cursive; padding: 24px; }
  h1 { font-family: 'Caveat', cursive; font-size: 32px; margin: 0 0 12px; }
  h1 em { background: var(--accent); padding: 0 6px; font-style: normal; }
  h2 { font-family: 'Caveat', cursive; font-size: 26px; margin: 30px 0 10px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; flex-wrap: wrap; }
  a, button, select { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .link { color: var(--ink); text-decoration: underline; }
  select, button { padding: 6px 10px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; min-height: 32px; }
  button.primary { background: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .pill { display: inline-block; padding: 1px 6px; border: 1px solid var(--ink); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  .pill.off { background: #eee; color: var(--muted); }
  .pill.approved { background: var(--good); color: #fff; }
  .pill.rejected { background: var(--danger); color: #fff; }
  .pill.posted { background: var(--accent); }
  #msg { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin: 10px 0; min-height: 1em; }
  .err { color: var(--danger); font-weight: 600; }
  .ok { color: var(--good); font-weight: 600; }
  .muted { color: var(--muted); }

  .bhead { border: 2px solid var(--ink); background: #fff; box-shadow: 2px 3px 0 rgba(0,0,0,0.9); padding: 12px 14px; margin-bottom: 14px; }
  .bhead .counts { font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bhead .notes { margin-top: 8px; font-size: 15px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .filters button.on { background: var(--accent); font-weight: 600; }

  .draft { border: 2px solid var(--ink); background: #fff; box-shadow: 2px 3px 0 rgba(0,0,0,0.9); padding: 14px; margin-bottom: 18px; }
  .draft > header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
  .draft > header .title { font-family: 'Caveat', cursive; font-size: 24px; }
  .copyblock { border: 1px dashed rgba(0,0,0,0.3); padding: 8px 10px; margin-bottom: 8px; position: relative; }
  .copyblock .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 4px; }
  .copyblock .body { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.45; }
  .copyblock button { position: absolute; top: 6px; right: 6px; padding: 2px 8px; min-height: 0; font-size: 11px; }
  details.facts { margin: 8px 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  details.facts pre { white-space: pre-wrap; word-break: break-word; background: #f6f4ee; padding: 8px; margin: 6px 0 0; border: 1px dashed rgba(0,0,0,0.2); }

  .artifact { border-top: 1px dashed rgba(0,0,0,0.2); padding-top: 12px; margin-top: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  .artifact .preview { flex: 0 0 200px; }
  .artifact .preview img { width: 100%; border: 1.5px solid var(--ink); display: block; margin-bottom: 6px; background: #f2f0ea; }
  .artifact .preview .noimg { border: 1.5px dashed rgba(0,0,0,0.3); padding: 22px 8px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .artifact .meta { flex: 1; min-width: 240px; }
  .artifact .meta .line { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-bottom: 6px; }
  .artifact .reel-frame { border: 1.5px solid var(--ink); background: #111; color: #fff; padding: 14px; margin-bottom: 8px; }
  .artifact .reel-frame .l1 { font-family: 'Caveat', cursive; font-size: 26px; line-height: 1.1; }
  .artifact .reel-frame .l2 { font-size: 16px; opacity: .85; }
  .artifact .preview video { width: 100%; border: 1.5px solid var(--ink); display: block; margin-bottom: 6px; background: #111; }
  .artifact .preview .loadvid { width: 100%; }
  .artifact .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .statusbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .statusbar button.on { background: var(--accent); font-weight: 600; }
  .statusbar button.on[data-status="approved"] { background: var(--good); color: #fff; }
  .statusbar button.on[data-status="rejected"] { background: var(--danger); color: #fff; }
  .audit { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .empty { padding: 14px; color: var(--muted); }

  @media (max-width: 640px) {
    body { padding: 14px; }
    h1 { font-size: 26px; }
    .artifact .preview { flex: 0 0 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1><em>Social</em> · content review</h1>
  <div class="actions">
    <a class="link" href="/">← Back to app</a>
    <a class="link" href="/admin">Admin</a>
    <a class="link" href="/review">Review</a>
    <span style="flex:1"></span>
    <select id="batch" aria-label="Staged batch"></select>
    <button id="reload" class="primary">Reload</button>
  </div>
  <div id="msg"></div>
  <div id="bhead"></div>
  <div class="filters" id="filters"></div>
  <div id="content"></div>
</div>
<script>
  const API = window.API_BASE;
  const STATUSES = ['pending', 'approved', 'rejected', 'posted'];
  const state = { date: null, batch: null, filter: 'all' };
  // Blob URLs minted for previews/downloads, revoked when the batch re-renders.
  let blobUrls = [];

  function authFetch(url, opts) {
    return window.Auth && window.Auth.fetchWithAuth
      ? window.Auth.fetchWithAuth(url, opts)
      : fetch(url, opts);
  }

  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function fmtWhen(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
  }

  function setMsg(html, cls) {
    document.getElementById('msg').innerHTML = cls ? '<span class="' + cls + '">' + html + '</span>' : html;
  }

  function notAuthorised(r) {
    if (r.status === 401 || r.status === 403) {
      setMsg('Not authorised.', 'err');
      document.getElementById('msg').insertAdjacentHTML('beforeend',
        ' Sign in as an admin from the main app, then return.');
      return true;
    }
    return false;
  }

  function releaseBlobs() {
    blobUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
    blobUrls = [];
  }

  function assetPath(date, relpath, download) {
    return API + '/social/asset/' + encodeURIComponent(date) + '/'
      + relpath.split('/').map(encodeURIComponent).join('/')
      + (download ? '?download=1' : '');
  }

  // Assets are admin-gated, so <img src> can't fetch them directly (no way to
  // attach the bearer token). Fetch with auth and hand the <img> a blob: URL.
  async function previewInto(img, date, relpath) {
    try {
      const r = await authFetch(assetPath(date, relpath, false));
      if (!r.ok) throw new Error(r.status);
      const url = URL.createObjectURL(await r.blob());
      blobUrls.push(url);
      img.src = url;
    } catch (e) {
      img.replaceWith(Object.assign(document.createElement('div'),
        { className: 'noimg', textContent: 'preview unavailable' }));
    }
  }

  async function download(url, fallbackName, btn) {
    const label = btn && btn.textContent;
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    try {
      const r = await authFetch(url);
      if (!r.ok) throw new Error(r.status);
      const disp = r.headers.get('content-disposition') || '';
      const m = /filename="([^"]+)"/.exec(disp);
      const blobUrl = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = m ? m[1] : fallbackName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
    } catch (e) {
      setMsg('Download failed (' + e.message + ').', 'err');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = label; }
    }
  }

  function reelUrl(date, stem) {
    return API + '/social/reel/' + encodeURIComponent(date) + '/' + encodeURIComponent(stem);
  }

  // Same blob trick as the card previews: <video src> can't carry the bearer
  // token, so fetch with auth and play the result locally. Seeking works
  // because the whole file is in memory by then.
  async function loadVideo(btn, stem) {
    btn.disabled = true;
    btn.textContent = 'loading…';
    try {
      const r = await authFetch(reelUrl(state.date, stem));
      if (!r.ok) throw new Error(r.status);
      const url = URL.createObjectURL(await r.blob());
      blobUrls.push(url);
      const v = document.createElement('video');
      v.controls = true;
      v.playsInline = true;
      v.src = url;
      btn.replaceWith(v);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '▶ load video';
      setMsg('Reel unavailable (' + e.message + ').', 'err');
    }
  }

  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
    const label = btn.textContent;
    btn.textContent = 'copied';
    setTimeout(() => { btn.textContent = label; }, 1200);
  }

  // ── loading ────────────────────────────────────────────────────────────────
  async function loadBatches() {
    const r = await authFetch(API + '/social/batches');
    if (notAuthorised(r)) return;
    if (!r.ok) { setMsg('Error ' + r.status, 'err'); return; }
    const batches = await r.json();
    const sel = document.getElementById('batch');
    sel.innerHTML = '';
    if (!batches.length) {
      document.getElementById('content').innerHTML =
        '<div class="empty">no staged batches yet — run the content-poster workflow.</div>';
      return;
    }
    for (const b of batches) {
      const opt = document.createElement('option');
      opt.value = b.date;
      const decided = b.statuses.approved + b.statuses.rejected + b.statuses.posted;
      opt.textContent = b.date + ' · ' + b.n_drafts + ' drafts'
        + (b.error ? ' · UNREADABLE' : '') + (decided ? ' · ' + decided + ' decided' : '');
      sel.appendChild(opt);
    }
    const wanted = batches.some(b => b.date === state.date) ? state.date : batches[0].date;
    sel.value = wanted;
    await loadBatch(wanted);
  }

  async function loadBatch(date) {
    state.date = date;
    setMsg('');
    const r = await authFetch(API + '/social/batch/' + encodeURIComponent(date));
    if (notAuthorised(r)) return;
    if (!r.ok) { setMsg('Error ' + r.status + ' loading ' + escapeHtml(date), 'err'); return; }
    state.batch = await r.json();
    render();
  }

  // ── rendering ──────────────────────────────────────────────────────────────
  function allArtifacts() {
    const b = state.batch;
    if (!b) return [];
    return b.drafts.reduce((acc, d) => acc.concat(d.artifacts), []).concat(b.orphan_artifacts);
  }

  function renderHead() {
    const b = state.batch;
    const counts = {};
    STATUSES.forEach(s => { counts[s] = 0; });
    allArtifacts().forEach(a => { counts[a.status] = (counts[a.status] || 0) + 1; });
    const pills = STATUSES.map(s =>
      '<span class="pill ' + (s === 'pending' ? 'off' : s) + '">' + s + ' ' + counts[s] + '</span>'
    ).join(' ');
    document.getElementById('bhead').innerHTML =
      '<div class="bhead">' +
        '<div class="counts">' +
          '<b>' + escapeHtml(b.date) + '</b>' +
          '<span class="muted">generated ' + escapeHtml(fmtWhen(b.generated_at)) + '</span>' +
          '<span style="flex:1"></span>' + pills +
        '</div>' +
        (b.editor_notes ? '<div class="notes">' + escapeHtml(b.editor_notes) + '</div>' : '') +
        (b.rejected && b.rejected.length
          ? '<div class="notes muted">dropped by the validator: ' + escapeHtml(b.rejected.join('; ')) + '</div>'
          : '') +
      '</div>';

    document.getElementById('filters').innerHTML =
      ['all'].concat(STATUSES).map(f =>
        '<button data-filter="' + f + '"' + (state.filter === f ? ' class="on"' : '') + '>' + f +
        (f === 'all' ? '' : ' (' + counts[f] + ')') + '</button>'
      ).join('');
  }

  function copyblock(label, text) {
    if (!text) return '';
    return '<div class="copyblock">' +
      '<span class="lbl">' + escapeHtml(label) + '</span>' +
      '<div class="body">' + escapeHtml(text) + '</div>' +
      '<button data-copy="' + encodeURIComponent(text) + '">copy</button>' +
    '</div>';
  }

  function artifactHtml(a) {
    const isReel = a.kind === 'reel';
    const hook = a.reel_hook_render || '';
    let preview;
    if (a.png_available) {
      preview = a.png_paths.map((p, i) =>
        '<img alt="' + escapeHtml(a.stem) + ' slide ' + (i + 1) + '" data-preview="' + escapeHtml(p) + '">'
      ).join('');
    } else if (isReel && a.video_available) {
      // Click-to-load: the MP4 comes through the admin gate as a blob, so it
      // must be fetched whole. Six of them on page load would be megabytes
      // nobody asked for.
      preview = '<button class="loadvid" data-video="' + escapeHtml(a.stem) + '">▶ load video' +
        (a.video_bytes ? ' (' + Math.round(a.video_bytes / 1024) + ' KB)' : '') + '</button>';
    } else if (isReel) {
      preview = '<div class="noimg">no mp4 — this batch was staged before reels went to R2, or the render failed</div>';
    } else {
      preview = '<div class="noimg">not rendered</div>';
    }

    const dls = ['<button data-dl="' + escapeHtml(a.island_path) + '">island json</button>']
      .concat(a.png_paths.map((p, i) =>
        '<button data-dl="' + escapeHtml(p) + '">png' + (a.png_paths.length > 1 ? ' ' + (i + 1) : '') + '</button>'))
      .concat(a.video_available ? ['<button data-dlreel="' + escapeHtml(a.stem) + '">mp4</button>'] : []);

    const statusBtns = STATUSES.map(s =>
      '<button data-status="' + s + '" data-kind="' + escapeHtml(a.kind) + '" data-stem="' + escapeHtml(a.stem) + '"' +
      (a.status === s ? ' class="on"' : '') + '>' + s + '</button>'
    ).join('');

    return '<div class="artifact">' +
      '<div class="preview">' + preview + '</div>' +
      '<div class="meta">' +
        '<div class="line"><b>' + escapeHtml(a.kind) + '</b> · ' + escapeHtml(a.stem) +
          ' · <span class="muted">' + escapeHtml(a.template) + '</span></div>' +
        (a.headline ? '<div class="line">headline: ' + escapeHtml(a.headline) + '</div>' : '') +
        (hook ? '<div class="reel-frame">' + hook + '</div>' : '') +
        '<div class="btns">' + dls.join('') + '</div>' +
        '<div class="statusbar">' + statusBtns +
          (a.posted_url ? ' <a class="link" target="_blank" rel="noopener" href="' + escapeHtml(a.posted_url) + '">open post ↗</a>' : '') +
        '</div>' +
        (a.updated_at
          ? '<div class="audit">' + escapeHtml(a.status) + ' by ' + escapeHtml(a.updated_by_email || '?') +
            ' · ' + escapeHtml(fmtWhen(a.updated_at)) +
            (a.note ? ' · ' + escapeHtml(a.note) : '') + '</div>'
          : '') +
      '</div>' +
    '</div>';
  }

  function draftHtml(d) {
    const arts = d.artifacts.filter(a => state.filter === 'all' || a.status === state.filter);
    if (!arts.length && state.filter !== 'all') return '';
    const title = [d.angle, d.hook_mechanism, (d.source && d.source.city)].filter(Boolean).join(' · ');
    const facts = JSON.stringify(d.source || {}, null, 2);
    const url = d.source && d.source.url;
    return '<section class="draft" data-draft="' + d.draft_index + '">' +
      '<header>' +
        '<span class="title">Draft ' + d.draft_index + '</span>' +
        '<span class="pill">' + escapeHtml(title || 'draft') + '</span>' +
        (d.auction_id ? '<span class="pill off">' + escapeHtml(d.auction_id) + '</span>' : '') +
        '<span style="flex:1"></span>' +
        '<button data-bundle="' + d.draft_index + '">download all (zip)</button>' +
      '</header>' +
      copyblock('post', d.post) +
      copyblock('hashtags', (d.hashtags || []).map(h => '#' + h).join(' ')) +
      copyblock('pinned comment', d.pinned_comment) +
      copyblock('alt text', d.alt_text) +
      copyblock('video title', d.video_title) +
      copyblock('location tag', d.location_tag) +
      '<details class="facts"><summary>grounded source facts' +
        (url ? ' · <a class="link" target="_blank" rel="noopener" href="' + escapeHtml(url) + '">notice ↗</a>' : '') +
        '</summary><pre>' + escapeHtml(facts) + '</pre></details>' +
      ((d.hook_alternatives || []).length
        ? '<details class="facts"><summary>hook alternatives</summary><pre>' +
          escapeHtml((d.hook_alternatives || []).join('\n')) + '</pre></details>'
        : '') +
      arts.map(artifactHtml).join('') +
    '</section>';
  }

  function render() {
    releaseBlobs();
    const b = state.batch;
    renderHead();

    // The reel's on-screen text lives on the draft, not the manifest row — copy
    // it onto the artifact so artifactHtml can render the first frame.
    b.drafts.forEach(d => d.artifacts.forEach(a => {
      if (a.kind === 'reel' && d.reel_hook) {
        a.reel_hook_render =
          '<div class="l1">' + escapeHtml(d.reel_hook.line1 || '') + '</div>' +
          '<div class="l2">' + escapeHtml(d.reel_hook.line2 || '') + '</div>' +
          (d.reel_context_lines || []).map(l => '<div class="l2">' + escapeHtml(l) + '</div>').join('');
      }
    }));

    const drafts = b.drafts.map(draftHtml).join('');
    const orphans = b.orphan_artifacts.filter(a => state.filter === 'all' || a.status === state.filter);
    const orphanHtml = orphans.length
      ? '<h2><em>Batch-level</em> assets</h2>' +
        '<section class="draft">' +
          '<div class="line muted" style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;margin-bottom:6px">' +
            'not tied to one draft — the stats reel and the city carousel.</div>' +
          orphans.map(artifactHtml).join('') +
        '</section>'
      : '';
    const html = drafts + orphanHtml;
    document.getElementById('content').innerHTML =
      html || '<div class="empty">nothing matches this filter.</div>';

    document.querySelectorAll('#content img[data-preview]').forEach(img => {
      previewInto(img, state.date, img.getAttribute('data-preview'));
    });
  }

  // ── actions ────────────────────────────────────────────────────────────────
  async function setStatus(kind, stem, status, btn) {
    const body = { status: status };
    if (status === 'posted') {
      const url = prompt('Posted where? (URL, optional)') || '';
      if (url.trim()) body.posted_url = url.trim();
    }
    btn.disabled = true;
    const r = await authFetch(
      API + '/social/item/' + encodeURIComponent(state.date) + '/' +
      encodeURIComponent(kind) + '/' + encodeURIComponent(stem),
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
    );
    btn.disabled = false;
    if (notAuthorised(r)) return;
    if (!r.ok) { setMsg('Save failed (' + r.status + ').', 'err'); return; }
    const saved = await r.json();
    // Patch the in-memory artifact and re-render so the rollup + filters stay true.
    allArtifacts().forEach(a => {
      if (a.kind === kind && a.stem === stem) {
        a.status = saved.status || status;
        a.note = saved.note || null;
        a.posted_url = saved.posted_url || null;
        a.updated_at = saved.updated_at || null;
        a.updated_by_email = saved.updated_by_email || null;
      }
    });
    render();
    setMsg('Saved.', 'ok');
    setTimeout(() => setMsg(''), 1200);
  }

  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!t || !t.getAttribute) return;

    const filter = t.getAttribute('data-filter');
    if (filter) { state.filter = filter; render(); return; }

    const copy = t.getAttribute('data-copy');
    if (copy) { copyText(decodeURIComponent(copy), t); return; }

    const rel = t.getAttribute('data-dl');
    if (rel) { download(assetPath(state.date, rel, true), rel.split('/').pop(), t); return; }

    const vid = t.getAttribute('data-video');
    if (vid) { loadVideo(t, vid); return; }

    const dlreel = t.getAttribute('data-dlreel');
    if (dlreel) { download(reelUrl(state.date, dlreel), dlreel + '.mp4', t); return; }

    const bundle = t.getAttribute('data-bundle');
    if (bundle) {
      download(API + '/social/bundle/' + encodeURIComponent(state.date) + '/' + bundle,
        state.date + '-draft-' + bundle + '.zip', t);
      return;
    }

    const status = t.getAttribute('data-status');
    if (status) { setStatus(t.getAttribute('data-kind'), t.getAttribute('data-stem'), status, t); return; }
  });

  document.getElementById('batch').addEventListener('change', (e) => loadBatch(e.target.value));
  document.getElementById('reload').addEventListener('click', () => loadBatches());
  loadBatches();
</script>
</body>
</html>
