<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Bank Auction Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  window.API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? ''
    : 'https://auction-api-w68b.onrender.com';
  window.SUPABASE_URL = window.SUPABASE_URL || 'https://yrcrxpwoqddfcengkryw.supabase.co';
  window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'sb_publishable_IT4CBVWS1a37sduWApOdFw_1UCR0kyJ';
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/auth.js"></script>
<style>
  :root { --ink: #1a1a1a; --paper: #faf7f0; --accent: #ffd84d; --danger: #d64a2e; --good: #2e8b57; --muted: #8a8a8a; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Kalam', cursive; padding: 24px; }
  h1 { font-family: 'Caveat', cursive; font-size: 32px; margin: 0 0 12px; }
  h1 em { background: var(--accent); padding: 0 6px; font-style: normal; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .actions { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  a, button { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .link { color: var(--ink); text-decoration: underline; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 2px solid var(--ink); box-shadow: 2px 3px 0 rgba(0,0,0,0.9); background: #fff; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 13px; min-width: 720px; }
  th, td { border-bottom: 1px dashed rgba(0,0,0,0.15); padding: 8px 10px; text-align: left; }
  th { background: var(--accent); font-weight: 600; }
  select, button { padding: 6px 10px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; min-height: 32px; }
  button.primary { background: var(--accent); font-weight: 600; }
  .pill { display: inline-block; padding: 1px 6px; border: 1px solid var(--ink); font-size: 11px; }
  .pill.admin { background: var(--accent); }
  .pill.off { background: #eee; color: var(--muted); }
  #msg { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin: 10px 0; min-height: 1em; }
  .err { color: var(--danger); font-weight: 600; }
  .ok { color: var(--good); font-weight: 600; }
  h2 { font-family: 'Caveat', cursive; font-size: 26px; margin: 32px 0 10px; }
  .fb-q { font-weight: 600; }
  .fb-text { color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .fb-meta { font-size: 11px; color: var(--muted); }
  .fb-empty { padding: 12px; font-family: 'Kalam', cursive; color: var(--muted); }
  td.fb-actions button { background: var(--danger); color: #fff; border-color: var(--ink); }
  @media (max-width: 640px) {
    body {
      padding: 14px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
    }
    h1 { font-size: 26px; }
    .actions { flex-wrap: wrap; gap: 8px; }
    th, td { padding: 6px 8px; }
    table { min-width: 560px; font-size: 12px; }
    .table-scroll { position: relative; }
    .table-scroll::after {
      content: ''; position: absolute; top: 0; right: 0; width: 18px; height: 100%;
      background: linear-gradient(to right, transparent, rgba(0,0,0,0.08));
      pointer-events: none;
    }
    select, button { min-height: 36px; font-size: 13px; }
    .fb-meta { word-break: break-all; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1><em>Admin</em> · users</h1>
  <div class="actions">
    <a class="link" href="/">← Back to app</a>
    <span style="flex:1"></span>
    <button id="reload" class="primary">Reload</button>
  </div>
  <div id="msg"></div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr><th>Email</th><th>Name</th><th>Role</th><th>Verified</th><th>Enabled</th><th>Actions</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <h2><em>Feedback</em> · unresolved</h2>
  <div id="fb-msg"></div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr><th style="width: 140px;">Created</th><th style="width: 80px;">Rating</th><th>Question / text</th><th style="width: 110px;">Actions</th></tr>
      </thead>
      <tbody id="fb-rows"></tbody>
    </table>
  </div>
</div>
<script>
  const API = window.API_BASE;
  function authFetch(url, opts) {
    return window.Auth && window.Auth.fetchWithAuth
      ? window.Auth.fetchWithAuth(url, opts)
      : fetch(url, opts);
  }

  async function load() {
    const msg = document.getElementById('msg');
    msg.textContent = '';
    const r = await authFetch(API + '/admin/users', { headers: { 'Content-Type': 'application/json' } });
    if (r.status === 401 || r.status === 403) {
      msg.innerHTML = '<span class="err">Not authorised.</span> Sign in as an admin from the main app, then return.';
      return;
    }
    if (!r.ok) { msg.innerHTML = '<span class="err">Error ' + r.status + '</span>'; return; }
    const users = await r.json();
    renderRows(users);
  }

  function renderRows(users) {
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    for (const u of users) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(u.email)}</td>
        <td>${escapeHtml(u.name || '')}</td>
        <td>
          <select data-id="${u.id}" data-field="role">
            <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
          </select>
        </td>
        <td>${u.email_verified ? '<span class="pill">yes</span>' : '<span class="pill off">no</span>'}</td>
        <td>
          <select data-id="${u.id}" data-field="enabled">
            <option value="true" ${u.enabled ? 'selected' : ''}>enabled</option>
            <option value="false" ${!u.enabled ? 'selected' : ''}>disabled</option>
          </select>
        </td>
        <td><button class="primary" data-save="${u.id}">Save</button></td>
      `;
      tbody.appendChild(tr);
    }
  }

  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  document.addEventListener('click', async (e) => {
    const id = e.target.getAttribute && e.target.getAttribute('data-save');
    if (!id) return;
    const row = e.target.closest('tr');
    const role = row.querySelector('select[data-field="role"]').value;
    const enabled = row.querySelector('select[data-field="enabled"]').value === 'true';
    const r = await authFetch(API + '/admin/users/' + id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role, enabled }),
    });
    const msg = document.getElementById('msg');
    msg.innerHTML = r.ok ? '<span class="ok">Saved.</span>' : '<span class="err">Save failed.</span>';
    if (r.ok) setTimeout(() => { msg.textContent = ''; }, 1500);
  });

  async function loadFeedback() {
    const fbMsg = document.getElementById('fb-msg');
    fbMsg.textContent = '';
    const r = await authFetch(API + '/admin/feedback?unresolved_only=true&limit=100', {
      headers: { 'Content-Type': 'application/json' },
    });
    if (r.status === 401 || r.status === 403) {
      fbMsg.innerHTML = '<span class="err">Not authorised.</span>';
      return;
    }
    if (!r.ok) { fbMsg.innerHTML = '<span class="err">Error ' + r.status + '</span>'; return; }
    const items = await r.json();
    renderFeedback(items);
  }

  function fmtWhen(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
  }

  function renderFeedback(items) {
    const tbody = document.getElementById('fb-rows');
    tbody.innerHTML = '';
    if (!items || !items.length) {
      tbody.innerHTML = '<tr><td colspan="4"><div class="fb-empty">no unresolved feedback — nicely done.</div></td></tr>';
      return;
    }
    for (const f of items) {
      const tr = document.createElement('tr');
      const rating = f.rating ? f.rating : (f.kind === 'general' ? 'general' : '');
      const qline = f.question ? `<div class="fb-q">${escapeHtml(f.question)}</div>` : '';
      const tline = f.text ? `<div class="fb-text">${escapeHtml(f.text)}</div>` : '';
      const meta = `<div class="fb-meta">id: ${escapeHtml(f.id)} · session: ${escapeHtml(f.session_id)}</div>`;
      tr.innerHTML = `
        <td>${escapeHtml(fmtWhen(f.created_at))}</td>
        <td>${escapeHtml(rating)}</td>
        <td>${qline}${tline}${meta}</td>
        <td class="fb-actions"><button data-close="${escapeHtml(f.id)}">Close</button></td>
      `;
      tbody.appendChild(tr);
    }
  }

  document.addEventListener('click', async (e) => {
    const id = e.target.getAttribute && e.target.getAttribute('data-close');
    if (!id) return;
    e.target.disabled = true;
    const r = await authFetch(API + '/feedback/' + encodeURIComponent(id) + '/resolve', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    });
    const fbMsg = document.getElementById('fb-msg');
    if (r.ok) {
      fbMsg.innerHTML = '<span class="ok">Closed.</span>';
      const tr = e.target.closest('tr');
      if (tr) tr.remove();
      if (!document.querySelectorAll('#fb-rows tr').length) renderFeedback([]);
      setTimeout(() => { fbMsg.textContent = ''; }, 1500);
    } else {
      e.target.disabled = false;
      fbMsg.innerHTML = '<span class="err">Close failed (' + r.status + ').</span>';
    }
  });

  document.getElementById('reload').addEventListener('click', () => { load(); loadFeedback(); });
  load();
  loadFeedback();
</script>
</body>
</html>
