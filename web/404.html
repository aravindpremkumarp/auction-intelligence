<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>
<style>
:root {
  --ink: #0f172a;
  --ink-soft: #334155;
  --muted: #64748b;
  --paper: #f8fafc;
  --paper-2: #f1f5f9;
  --card: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #eff6ff;
  --on-accent: #ffffff;
  --shadow: 0 1px 3px rgba(15,23,42,0.08), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 6px 16px -6px rgba(15,23,42,0.12), 0 2px 6px -2px rgba(15,23,42,0.06);
  color-scheme: light;
}
[data-theme="dark"] {
  --ink: #f1f5f9;
  --ink-soft: #cbd5e1;
  --muted: #94a3b8;
  --paper: #0b1120;
  --paper-2: #1a2334;
  --card: #111827;
  --border: #243044;
  --border-strong: #33415c;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-soft: #172033;
  --on-accent: #0b1220;
  --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 18px -6px rgba(0,0,0,0.6), 0 2px 6px -2px rgba(0,0,0,0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.topbar {
  display: flex; align-items: center;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
}
.brand {
  display: inline-flex; align-items: center; gap: 9px;
  font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--ink); text-decoration: none;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--accent); display: grid; place-items: center;
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
}
.brand-name span { color: var(--muted); font-weight: 500; }
main {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding: 48px 24px 80px;
  text-align: center;
}
.code {
  font-size: 13px; font-weight: 600; color: var(--accent);
  letter-spacing: 0.02em;
}
h1 {
  margin: 0;
  font-size: clamp(28px, 4.4vw, 40px);
  font-weight: 700; letter-spacing: -0.025em; line-height: 1.1;
}
p {
  margin: 0; max-width: 440px;
  font-size: 15px; color: var(--muted);
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.btn {
  display: inline-block;
  padding: 11px 20px;
  border: 1px solid transparent; border-radius: 8px;
  background: var(--accent); color: var(--on-accent);
  font-size: 14px; font-weight: 600; text-decoration: none;
  box-shadow: var(--shadow);
  transition: background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn.ghost { background: var(--card); color: var(--ink); border-color: var(--border-strong); }
.btn.ghost:hover { background: var(--paper-2); }
</style>
</head>
