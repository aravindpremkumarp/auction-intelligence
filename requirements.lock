# requirements.lock — fully pinned, reproducible install for the API service.
#
# Generated from requirements.txt (the high-level dependency list) on Python
# 3.11 by installing into a clean venv and running `pip freeze`. Use this for
# byte-for-byte reproducible deploys/CI:
#
#     pip install -r requirements.lock
#
# Regenerate after editing requirements.txt:
#
#     python3.11 -m venv /tmp/lock && . /tmp/lock/bin/activate
#     pip install -r requirements.txt && pip freeze > requirements.lock
#
# That resolves everything fresh and moves every transitive pin. To *add* a
# dependency without dragging the rest of the tree forward, seed the venv from
# this file first, then install only the new package and freeze:
#
#     pip install -r requirements.lock && pip install 'newpkg>=1,<2'
#     pip check && pip freeze > requirements.lock
#
# requirements.txt stays the source of truth for *intended* version ranges;
# this file pins the exact transitive set those ranges resolved to.
