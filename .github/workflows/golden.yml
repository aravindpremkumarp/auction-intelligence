name: Golden-question eval

# Runs the live golden-question harness against the real OpenRouter + Neo4j
# stack. Scheduled nightly; can also be triggered manually via the UI or an
# explicit push to the `claude/**` branches. Secrets must be configured:
# OPENROUTER_API_KEY, OPENROUTER_MODEL, NEO4J_URI, NEO4J_USERNAME,
# NEO4J_PASSWORD, NEO4J_DATABASE, OPENAI_API_KEY.

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_LIVE_EVAL: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL:   ${{ secrets.OPENROUTER_MODEL }}
      NEO4J_URI:          ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME:     ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD:     ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE:     ${{ secrets.NEO4J_DATABASE }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run golden-question live eval
        run: pytest tests/api/test_golden_questions.py -v --tb=short
