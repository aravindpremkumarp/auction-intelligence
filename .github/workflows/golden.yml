name: Golden-question eval

# Runs the live golden-question eval (evals/run_golden.py) against the real
# OpenRouter + Neo4j stack using pydantic-evals: each catalogue question is run
# through the agent, scored on tool-trajectory (CI gate) + LLM-as-judge answer
# quality, and — when LOGFIRE_TOKEN is set — streamed to Logfire as a browsable
# experiment. Scheduled nightly; also triggerable manually. Secrets required:
# OPENROUTER_API_KEY, OPENROUTER_MODEL, NEO4J_URI, NEO4J_USERNAME,
# NEO4J_PASSWORD, NEO4J_DATABASE, OPENAI_API_KEY. Optional: LOGFIRE_TOKEN,
# EVAL_JUDGE_MODEL.

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL:   ${{ secrets.OPENROUTER_MODEL }}
      NEO4J_URI:          ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME:     ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD:     ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE:     ${{ secrets.NEO4J_DATABASE }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      LOGFIRE_TOKEN:      ${{ secrets.LOGFIRE_TOKEN }}
      LOGFIRE_ENVIRONMENT: ci
      EVAL_JUDGE_MODEL:   ${{ secrets.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pydantic-evals
      - name: Run golden-question live eval
        run: python -m evals.run_golden
