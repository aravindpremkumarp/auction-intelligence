name: Sync feedback

# Manual only. This ran on "*/15 * * * *" — ~2,880 runs a month, which on its
# own exceeded the account's whole Actions allowance and took CI down for every
# workflow in the repo (see the 2026-08-26 outage: every job across every
# workflow died in ~3s with no logs once the minutes ran out). Feedback triage
# does not need 15-minute freshness; run it from the Actions tab when you want
# a fresh snapshot. Re-adding a schedule here is a billing decision — if it
# comes back, make it hourly at most, and check the minute budget first.
on:
  workflow_dispatch:

concurrency:
  group: sync-feedback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      API: https://auction-api-w68b.onrender.com
      TOKEN: ${{ secrets.FEEDBACK_RESOLVE_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch feedback from API
        run: |
          if [ -z "$TOKEN" ]; then
            echo "FEEDBACK_RESOLVE_TOKEN secret not set — skipping."
            exit 0
          fi
          mkdir -p feedback
          # Strip users' chat context and browser fingerprint before the
          # snapshot lands in the repo — triage needs the rating/text/question,
          # not the full conversation.
          curl -fsS -H "X-Resolve-Token: $TOKEN" \
            "$API/feedback/recent?limit=200&unresolved_only=false" \
            | jq 'map(del(.context_turns, .user_agent)) | sort_by(.created_at) | reverse' > feedback/all.json
          curl -fsS -H "X-Resolve-Token: $TOKEN" \
            "$API/feedback/recent?limit=200&unresolved_only=true" \
            | jq 'map(del(.context_turns, .user_agent)) | sort_by(.created_at) | reverse' > feedback/unresolved.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback/all.json feedback/unresolved.json
          if git diff --cached --quiet; then
            echo "No feedback changes."
            exit 0
          fi
          git commit -m "Sync feedback snapshot [skip ci]"
          git push
