# Content-ops Agent A — "The Poster" (spec: docs/marketing/content-agents.md).
#
# Manual-dispatch ONLY, by design: the founder runs this right after each data
# refresh (scrape), so drafts always reflect fresh auctions. No cron — content
# generated from stale data would advertise closed auctions.
#
# Two engines write the drafts (marketing_agents/poster.py runs as staged
# steps: --prepare -> <engine writes response.txt> -> --finalize):
#   * claude-max (DEFAULT) — Claude Code authenticated with the founder's
#     Claude Max subscription via the CLAUDE_CODE_OAUTH_TOKEN secret
#     (generated locally with `claude setup-token`, valid ~1 year).
#     No per-token API cost.
#   * openrouter — the API fallback (--generate), kept for when the Max
#     token is unavailable or we want a specific model.
#
# Tier-1 guardrail: this DRAFTS and STAGES only. It commits drafts to
# marketing/outputs/<date>/ and opens/refreshes a "content-review" issue.
# It never posts to any social platform. A human reviews and publishes.
#
# Kill switch: set the repo Actions variable AGENTS_ENABLED to "false"
# (Settings → Secrets and variables → Actions → Variables) to disable.
name: Content poster (draft + stage)

on:
  workflow_dispatch:
    inputs:
      max_drafts:
        description: "How many drafts to generate"
        default: "5"
        required: false
      engine:
        description: "LLM engine"
        type: choice
        options:
          - claude-max
          - openrouter
        default: claude-max
        required: false

concurrency:
  group: content-poster
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  API_BASE: https://auction-api-w68b.onrender.com
  AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED || 'true' }}
  POSTER_WORK_DIR: .poster_work

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.AGENTS_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Prepare (fetch data, build prompt)
        run: |
          pip install --quiet "httpx>=0.27,<1"
          python -m marketing_agents.poster --prepare --max-drafts "${{ inputs.max_drafts }}"

      - name: Generate with Claude Code (Max subscription — default)
        if: ${{ inputs.engine != 'openrouter' }}
        env:
          # 1-year OAuth token from `claude setup-token` (needs Pro/Max).
          # Add as a repo secret: Settings → Secrets and variables → Actions.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is missing. Run 'claude setup-token' locally (Max plan), add the token as a repo secret, or re-run this workflow with engine=openrouter."
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Read the file $POSTER_WORK_DIR/prompt.txt and follow its instructions exactly. Write ONLY the raw JSON output it asks for (no prose, no markdown, no code fences) to the file $POSTER_WORK_DIR/response.txt. Do not modify any other file." \
            --allowedTools "Read,Write" \
            --permission-mode acceptEdits
          if [ ! -s "$POSTER_WORK_DIR/response.txt" ]; then
            echo "::error::Claude Code did not write $POSTER_WORK_DIR/response.txt"
            exit 1
          fi

      - name: Generate with OpenRouter (API fallback)
        if: ${{ inputs.engine == 'openrouter' }}
        env:
          # OPENROUTER_CHAT_API_KEY is the valid key production chat bills
          # against; the plain OPENROUTER_API_KEY secret is stale and 401s
          # (same trap golden.yml documents). The module prefers the chat
          # key and falls back to the legacy one.
          OPENROUTER_CHAT_API_KEY: ${{ secrets.OPENROUTER_CHAT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.POSTER_MODEL || 'deepseek/deepseek-v4-flash' }}
        run: python -m marketing_agents.poster --generate

      - name: Finalize (validate + stage drafts)
        run: python -m marketing_agents.poster --finalize

      - name: Commit staged drafts
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/outputs
          if git diff --cached --quiet; then
            echo "No new drafts to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Stage content drafts $(date -u +%F) [skip ci]"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the content-review issue
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const today = new Date().toISOString().slice(0, 10);
            const path = `marketing/outputs/${today}/review.md`;
            let body;
            try {
              body = fs.readFileSync(path, "utf8");
            } catch {
              body = `New drafts staged in \`${path}\` (review file missing).`;
            }
            body += `\n\n---\n_Staged by the content-poster workflow (engine: ${{ inputs.engine || 'claude-max' }}). Nothing is published automatically._`;
            const title = `Content review — ${today}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "content-review",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["content-review"],
              });
            }
