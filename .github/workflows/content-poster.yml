# Content-ops Agent A — "The Poster" (spec: docs/marketing/content-agents.md).
#
# Manual-dispatch ONLY, by design: the founder runs this right after each data
# refresh (scrape), so drafts always reflect fresh auctions. No cron — content
# generated from stale data would advertise closed auctions.
#
# Two engines write the drafts (marketing_agents/poster.py runs as staged
# steps: --prepare -> <engine writes response.txt> -> --finalize):
#   * claude-max (DEFAULT) — Claude Code authenticated with the founder's
#     Claude Max subscription via the CLAUDE_CODE_OAUTH_TOKEN secret
#     (generated locally with `claude setup-token`, valid ~1 year).
#     No per-token API cost.
#   * openrouter — the API fallback (--generate), kept for when the Max
#     token is unavailable or we want a specific model.
#
# Tier-1 guardrail: this DRAFTS and STAGES only. It commits drafts to
# marketing/outputs/<date>/ and opens/refreshes a "content-review" issue.
# It never posts to any social platform. A human reviews and publishes.
#
# Kill switch: set the repo Actions variable AGENTS_ENABLED to "false"
# (Settings → Secrets and variables → Actions → Variables) to disable.
name: Content poster (draft + stage)

on:
  workflow_dispatch:
    inputs:
      max_drafts:
        description: "How many drafts to generate"
        default: "5"
        required: false
      engine:
        description: "LLM engine"
        type: choice
        options:
          - claude-max
          - openrouter
        default: claude-max
        required: false
      render_reels:
        description: "Render staged reels to MP4 (uploaded to R2, watchable on /social)"
        type: boolean
        default: true
        required: false

concurrency:
  group: content-poster
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  API_BASE: https://auction-api-w68b.onrender.com
  AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED || 'true' }}
  POSTER_WORK_DIR: .poster_work

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # drafting ~10min; reel renders ~2min each on top
    if: ${{ vars.AGENTS_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"

      - name: Prepare (fetch data, build prompt)
        run: |
          pip install --quiet "httpx>=0.27,<1"
          python -m marketing_agents.poster --prepare --max-drafts "${{ inputs.max_drafts }}"

      - name: Generate with Claude Code (Max subscription — default)
        if: ${{ inputs.engine != 'openrouter' }}
        env:
          # 1-year OAuth token from `claude setup-token` (needs Pro/Max).
          # Add as a repo secret: Settings → Secrets and variables → Actions.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is missing. Run 'claude setup-token' locally (Max plan), add the token as a repo secret, or re-run this workflow with engine=openrouter."
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Read the file $POSTER_WORK_DIR/prompt.txt and follow its instructions exactly. Write ONLY the raw JSON output it asks for (no prose, no markdown, no code fences) to the file $POSTER_WORK_DIR/response.txt. Do not modify any other file." \
            --allowedTools "Read,Write" \
            --permission-mode acceptEdits
          if [ ! -s "$POSTER_WORK_DIR/response.txt" ]; then
            echo "::error::Claude Code did not write $POSTER_WORK_DIR/response.txt"
            exit 1
          fi

      - name: Generate with OpenRouter (API fallback)
        if: ${{ inputs.engine == 'openrouter' }}
        env:
          # OPENROUTER_CHAT_API_KEY is the valid key production chat bills
          # against; the plain OPENROUTER_API_KEY secret is stale and 401s
          # (same trap golden.yml documents). The module prefers the chat
          # key and falls back to the legacy one.
          OPENROUTER_CHAT_API_KEY: ${{ secrets.OPENROUTER_CHAT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.POSTER_MODEL || 'deepseek/deepseek-v4-flash' }}
        run: python -m marketing_agents.poster --generate

      - name: Finalize (validate + stage drafts)
        run: python -m marketing_agents.poster --finalize

      # Render the staged cards + carousel slides to PNGs BEFORE the commit, so
      # their R2 keys land in the same drafts.json commit as the drafts
      # themselves. Soft-fails so a render hiccup never blocks the drafts.
      - name: Render card images
        continue-on-error: true
        run: |
          TODAY=$(date -u +%F)
          MANIFEST="marketing/outputs/$TODAY/drafts.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "no drafts.json for $TODAY — nothing to render"
            exit 0
          fi
          pip install --quiet playwright
          python -m playwright install chromium
          python marketing/render_social.py --render-staged "marketing/outputs/$TODAY" \
            || echo "::warning::card render failed (drafts are unaffected)"

      # Rendered PNGs go to R2, not git (marketing/outputs/*/rendered/ is
      # gitignored): a weekly batch of 5-8 images accumulates forever, the same
      # reason the property OG cards already live in R2. The keys are recorded
      # in drafts.json so /social can resolve them. If R2 is unconfigured the
      # script exits 2 and the PNGs simply stay local to this runner — the
      # drafts still ship, the review page just has no card previews.
      - name: Upload card images to R2
        id: cards_r2
        continue-on-error: true
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:   ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_PRIVATE_BUCKET:    ${{ secrets.R2_PRIVATE_BUCKET || 'auction-dossiers' }}
        run: |
          pip install --quiet boto3 python-dotenv
          TODAY=$(date -u +%F)
          set +e
          python scripts/upload_batch_media_to_r2.py --batch "marketing/outputs/$TODAY"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::R2 not configured — card images will not be viewable on /social"
          else
            echo "::warning::card upload to R2 failed — images will not be viewable on /social"
          fi

      - name: Commit staged drafts
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/outputs
          if git diff --cached --quiet; then
            echo "No new drafts to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Stage content drafts $(date -u +%F) [skip ci]"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

# ---- Reel rendering (never blocks drafting: every step soft-fails) --------
      # MP4s are never committed — binaries would grow the repo forever. They go
      # to the PRIVATE R2 bucket and their keys are written back into
      # drafts.json, so /social can play them long after this run's artifact
      # retention would have expired. The artifact upload below stays as the
      # fallback for when R2 isn't configured. Reels render silent by design:
      # add trending audio in-app at publish.
      - name: Set up Node for reel rendering
        if: ${{ inputs.render_reels != false && steps.commit.outputs.committed == 'true' }}
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned HyperFrames toolchain
        if: ${{ inputs.render_reels != false && steps.commit.outputs.committed == 'true' }}
        continue-on-error: true
        run: |
          # --ignore-scripts: onnxruntime's postinstall (talking-head features
          # we don't use) downloads binaries and is the flaky part; the
          # version is pinned because bare `npx hyperframes` can resolve to an
          # unpublished release (npm registry lag) and die silently.
          mkdir -p videos
          npm install --prefix videos --ignore-scripts --no-audit --no-fund \
            hyperframes@0.7.52 ffprobe-static
          npx playwright install chromium

      - name: Render staged reels
        id: reels
        if: ${{ inputs.render_reels != false && steps.commit.outputs.committed == 'true' }}
        continue-on-error: true
        run: |
          TODAY=$(date -u +%F)
          MANIFEST="marketing/outputs/$TODAY/drafts.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::warning::no drafts.json for $TODAY — skipping reel renders"
            exit 0
          fi
          python marketing/render_reel.py --manifest "$MANIFEST" \
            --out .reel_renders --quality high \
            || echo "::warning::one or more reels failed to render (drafts are unaffected)"
          ls -la .reel_renders/ 2>/dev/null || true
          if ls .reel_renders/*.mp4 >/dev/null 2>&1; then
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reels to R2 and record their keys
        id: reels_r2
        if: ${{ steps.reels.outputs.rendered == 'true' }}
        continue-on-error: true
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # storage.r2_client() builds one client for both buckets and validates
          # the PUBLIC config on the way, so these two are required even though
          # the media lands in the private bucket.
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL:   ${{ secrets.R2_PUBLIC_BASE_URL }}
          # An unset secret arrives as "", which would override storage.py's
          # default rather than fall back to it.
          R2_PRIVATE_BUCKET:    ${{ secrets.R2_PRIVATE_BUCKET || 'auction-dossiers' }}
        run: |
          pip install --quiet boto3 python-dotenv
          TODAY=$(date -u +%F)
          set +e
          python scripts/upload_batch_media_to_r2.py \
            --batch "marketing/outputs/$TODAY" --renders .reel_renders
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::R2 not configured — reels stay a 14-day artifact only"
          else
            echo "::warning::reel upload to R2 failed — falling back to the artifact"
          fi

      # Second commit: the upload wrote the reel keys into drafts.json after the
      # batch was already committed above. Without this the keys never reach
      # main and /social has no video to play.
      - name: Commit reel keys
        if: ${{ steps.reels_r2.outputs.uploaded == 'true' }}
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/outputs
          if git diff --cached --quiet; then
            echo "No reel keys to commit."
            exit 0
          fi
          git commit -m "Record staged reel R2 keys $(date -u +%F) [skip ci]"
          git pull --rebase --autostash
          git push

      # Fallback only: when the R2 upload didn't happen, the MP4s would
      # otherwise be unreachable, so keep publishing them as a 14-day artifact.
      - name: Upload reels artifact (fallback)
        if: ${{ steps.reels.outputs.rendered == 'true' && steps.reels_r2.outputs.uploaded != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: .reel_renders/*.mp4
          retention-days: 14

# ---------------------------------------------------------------------------
      - name: Open or refresh the content-review issue
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const today = new Date().toISOString().slice(0, 10);
            const path = `marketing/outputs/${today}/review.md`;
            let body;
            try {
              body = fs.readFileSync(path, "utf8");
            } catch {
              body = `New drafts staged in \`${path}\` (review file missing).`;
            }
            // Rendered images live in R2, not git, so there are no blob links
            // to hand out — /social is where you view them (and everything
            // else about the batch) behind the admin gate.
            try {
              const rdir = `marketing/outputs/${today}/rendered`;
              const pngs = fs.readdirSync(rdir).filter((f) => f.endsWith(".png")).sort();
              if (pngs.length) {
                body += `\n\n**🖼️ ${pngs.length} image(s) rendered** — view them with the captions on `
                  + `[/social](https://www.auctionscope.in/social).`;
              }
            } catch { /* no rendered dir — cards render is best-effort */ }
            const rendered = `${{ steps.reels.outputs.rendered || 'false' }}` === 'true';
            const onR2 = `${{ steps.reels_r2.outputs.uploaded || 'false' }}` === 'true';
            if (rendered && onR2) {
              body += `\n\n**🎬 Reels rendered** — watch them on [/social](https://www.auctionscope.in/social) alongside the captions. They render silent by design: **add trending audio in-app** when publishing — native audio is what drives reach.`;
            } else if (rendered) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              body += `\n\n**🎬 Reels rendered** — the R2 upload didn't run, so download the \`reels-${context.runId}\` artifact from [this run](${runUrl}) (kept 14 days). They render silent by design: **add trending audio in-app** when publishing — native audio is what drives reach.`;
            }
            body += `\n\n---\n_Staged by the content-poster workflow (engine: ${{ inputs.engine || 'claude-max' }}). Nothing is published automatically._`;
            const title = `Content review — ${today}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "content-review",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["content-review"],
              });
            }
