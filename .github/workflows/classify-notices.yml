name: Classify notices & highlight items

# Manual, one-click runner for the multi-property notice pipeline.
# Each step is gated by a boolean input so you can run them in isolation.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   OPENROUTER_API_KEY      - OpenRouter API key (sk-or-...)
#   NEO4J_URI               - e.g. neo4j+s://<instance>.databases.neo4j.io
#   NEO4J_USERNAME          - Aura instance id (= username)
#   NEO4J_PASSWORD          - Aura password
#   NEO4J_DATABASE          - Aura database name (usually same as username)
#
# Optional overrides:
#   OPENROUTER_MODEL        - default: google/gemini-2.0-flash-001

on:
  workflow_dispatch:
    inputs:
      classify_notices:
        description: "Step 1: classify single vs multi-property"
        type: boolean
        default: true
      extract_items:
        description: "Step 2a: extract per-item records for multi-property notices"
        type: boolean
        default: true
      match_items:
        description: "Step 2b: match each auction to its item"
        type: boolean
        default: true
      limit:
        description: "Optional row limit (blank = full run)"
        type: string
        default: ""
      dry_run:
        description: "Skip all Neo4j writes (just produce reports)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL:    ${{ secrets.OPENROUTER_MODEL || 'google/gemini-2.0-flash-001' }}
      NEO4J_URI:           ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME:      ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD:      ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE:      ${{ secrets.NEO4J_DATABASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (poppler for pdf2image)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install python deps
        run: |
          pip install -r requirements.txt
          pip install pdf2image Pillow

      - name: Step 1 - classify_notices
        if: ${{ inputs.classify_notices }}
        run: |
          python -m pipeline.classify_notices \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.dry_run && '--no-neo4j' || '' }}

      - name: Step 2a - extract_property_items
        if: ${{ inputs.extract_items }}
        run: |
          python -m pipeline.extract_property_items \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.dry_run && '--no-neo4j' || '' }}

      - name: Step 2b - match_items_to_auctions
        if: ${{ inputs.match_items }}
        run: |
          python -m pipeline.match_items_to_auctions \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: |
            pipeline/output/notice_classification.jsonl
            pipeline/output/property_items.jsonl
          if-no-files-found: ignore
          retention-days: 14
