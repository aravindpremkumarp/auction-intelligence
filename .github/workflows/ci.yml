name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit locked dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --disable-pip --no-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (locked)
        run: |
          pip install -r requirements.lock
          pip install pytest httpx
      - name: Run API tests
        env:
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_ANON_KEY: fake-anon
          APP_ENV: test
          RATELIMIT_DISABLED: "1"
          AUTH_ENABLED: "true"
        run: pytest tests/api -q
