name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Audit locked dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --disable-pip --no-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (locked)
        run: |
          pip install -r requirements.lock
          pip install pytest httpx
      # tests/scripts and tests/test_vercel_config.py cover the build-time and
      # deploy-config guards (property OG cards, the reel→R2 upload, the CSP
      # directives the review page needs). They were never in CI, so those
      # guards could rot silently — they're pure-stdlib and fast, so run them
      # here rather than leaving them as local-only.
      #
      # test_ink_coverage.py is named individually for the same reason. The
      # rest of tests/pipeline is not green, so the directory can't go in
      # wholesale, but the ink measure is the one part of it the API serves
      # directly (the annotator's Ink tab) and it is where the missing-region
      # threshold lives — a silent regression there mis-scores the review
      # queue. Needs only Pillow + PyMuPDF, both already in requirements.lock.
      #
      # test_apply_extractions.py joins it on the same grounds: the lot matcher
      # it covers is what decides which lot a listing IS, and the review queue
      # now explains its verdicts through the same functions
      # (apply_extractions.explain_lot_match), so a regression there is not
      # confined to the batch pipeline — it misinforms a human reviewer. One of
      # its cases exists purely to hold the two callers together, and a guard
      # nothing runs is not a guard. Needs neo4j + python-dotenv + RapidFuzz,
      # all already in requirements.lock.
      - name: Run API tests
        env:
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_ANON_KEY: fake-anon
          APP_ENV: test
          RATELIMIT_DISABLED: "1"
          AUTH_ENABLED: "true"
        run: >
          pytest tests/api tests/scripts tests/test_vercel_config.py
          tests/pipeline/test_ink_coverage.py
          tests/pipeline/test_apply_extractions.py
          tests/pipeline/test_area_agreement.py
          tests/pipeline/test_property_taxonomy.py
          tests/pipeline/test_measures.py
          tests/pipeline/test_promote_extractions.py
          tests/pipeline/test_run_pipeline.py -q

  # Live Razorpay test-mode E2E + real-Neo4j concurrency (design D4/D5).
  # REQUIRED: this job goes red when the RAZORPAY_* secrets are absent — the gate
  # (tests/e2e/conftest.py) fails loudly in CI instead of skipping, so the paid
  # path can never silently rot. Neo4j is provided by an ephemeral service
  # container (a real Neo4j, isolated per run — no external test DB needed), so
  # only the RAZORPAY_* repository secrets are required to turn this green.
  e2e:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (locked)
        run: |
          pip install -r requirements.lock
          pip install pytest httpx
      - name: Wait for Neo4j to accept Bolt connections
        run: |
          python - <<'PY'
          import sys, time
          from neo4j import GraphDatabase
          for i in range(60):
              try:
                  d = GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "testpassword123"))
                  d.verify_connectivity()
                  d.close()
                  print("neo4j is ready")
                  sys.exit(0)
              except Exception as exc:  # noqa: BLE001
                  print(f"waiting for neo4j ({i})... {exc}")
                  time.sleep(2)
          sys.exit("neo4j did not become ready in time")
          PY
      - name: Run live Razorpay E2E (required)
        env:
          CI: "true"
          APP_ENV: test
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: testpassword123
          NEO4J_DATABASE: neo4j
        run: pytest tests/e2e -q
