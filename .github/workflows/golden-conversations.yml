name: Golden-conversation eval

# Runs the live MULTI-TURN conversation eval (evals/run_conversations.py)
# against the real OpenRouter + Neo4j stack. Each scripted conversation is
# played through the agent with history + rolling-scope threaded exactly as the
# /chat router does, then scored on tool trajectory, monotonic narrowing
# (50 -> 3 refinement funnels), filter carry-over, and no-stale-scope (topic
# switches). Streams to Logfire when LOGFIRE_TOKEN is set. Scheduled nightly;
# also triggerable manually. Same secrets as the single-turn golden eval.

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC every day (after the single-turn eval)
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL:   ${{ secrets.OPENROUTER_MODEL }}
      NEO4J_URI:          ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME:     ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD:     ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE:     ${{ secrets.NEO4J_DATABASE }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      LOGFIRE_TOKEN:      ${{ secrets.LOGFIRE_TOKEN }}
      LOGFIRE_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pydantic-evals
      - name: Run golden-conversation live eval
        run: python -m evals.run_conversations
