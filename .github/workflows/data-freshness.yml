# Weekly data-freshness check. The enrichment pipeline runs on a workstation,
# so this can't refresh the data itself — instead it reads the public /stats
# snapshot and opens (or updates) a GitHub issue when last_enriched goes stale,
# so a manual refresh actually gets triggered.
name: Data freshness check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

env:
  API: https://auction-api-w68b.onrender.com
  MAX_AGE_DAYS: 14

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /stats freshness
        id: stats
        run: |
          stats=$(curl -fsS "$API/stats")
          echo "$stats"
          last=$(echo "$stats" | jq -r '.last_enriched // empty')
          if [ -z "$last" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "detail=/stats returned no last_enriched value" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age_days=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "last_enriched=$last (${age_days}d old)"
          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "detail=last_enriched is $last (${age_days} days old, threshold ${MAX_AGE_DAYS})" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update staleness issue
        if: steps.stats.outputs.stale == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const detail = `${{ steps.stats.outputs.detail }}`;
            const title = "Auction data is stale — run the refresh pipeline";
            const body = [
              detail,
              "",
              "Refresh steps (workstation): scrape → prepare_tn_data → load_tn_to_neo4j →",
              "upload_downloads_to_r2 → run_pipeline → embed_descriptions → link_reauctions",
              "(see README, 'Data & enrichment pipeline').",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "data-freshness",
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["data-freshness"],
              });
            }
