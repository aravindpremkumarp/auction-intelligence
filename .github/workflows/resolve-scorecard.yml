# Weekly resolve scorecard — how much of the corpus is trustworthy, and which
# way it moved.
#
# Every number in the resolve plan was computed by hand, once, in a session.
# Nothing recomputed them, so a regression would have surfaced as a user
# complaint rather than a signal, and each fix had no way to prove it worked.
#
# READ-ONLY: the script writes no graph data. A failed run is a red badge, not
# damaged data, so this needs neither a concurrency group nor a lock — unlike
# resolve-entities.yml, two of these could run at once harmlessly.
#
# The snapshot is kept as a build artifact rather than committed: it measures
# the graph at a moment, not a source file, and a bot commit per week would
# bury real history. The previous week's artifact is pulled back with `gh`
# (already on the runner, authenticated by GITHUB_TOKEN) rather than a
# third-party download action, so this adds no new supply-chain dependency.
name: Weekly resolve scorecard

on:
  schedule:
    - cron: "0 22 * * 0" # Sundays 22:00 UTC — after the weekly resolver pass
  workflow_dispatch:

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `gh run download` reads this workflow's own past runs.
      actions: read
      contents: read
    env:
      NEO4J_URI:      ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The FIRST run has no baseline by definition, and a later one can find
      # the artifact expired — a missing baseline must cost the delta, never
      # the measurement, so every failure here is swallowed.
      - name: Fetch last week's snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow resolve-scorecard.yml \
                   --status success --limit 1 --json databaseId \
                   --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$last" ]; then
            gh run download "$last" --name resolve-scorecard --dir baseline \
              || echo "no usable baseline artifact on run $last"
          else
            echo "no previous successful run — this is the baseline"
          fi

      - name: Measure
        run: |
          args=""
          [ -f baseline/scorecard.json ] && args="--compare baseline/scorecard.json"
          python -m scripts.resolve_scorecard --json scorecard.json $args \
            | tee scorecard.txt

      # The rendered table in the run summary, so the numbers are readable
      # without downloading anything.
      - name: Publish to the run summary
        if: always()
        run: |
          {
            echo '```'
            cat scorecard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: resolve-scorecard
          path: |
            scorecard.json
            scorecard.txt
          retention-days: 90
