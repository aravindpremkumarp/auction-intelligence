# The extraction backlog (replaces the Render cron "auction-extract").
#
# pipeline/load_extractions is resumable: each run takes whatever Documents
# still lack extraction_json, so a schedule that re-runs it is the whole
# strategy. --max-seconds 19800 (5.5 h) stays under both the 6-hour gap and
# GitHub's 6-hour job limit; un-started pages simply stay pending.
#
# Every run spends OpenRouter credit. The schedule only runs when the repo
# variable EXTRACT_SCHEDULE_ENABLED is "true" (Settings -> Secrets and
# variables -> Actions -> Variables). Manual runs always work.
name: Extraction backlog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel model calls"
        default: "24"
      max_seconds:
        description: "Stop starting new pages after this many seconds"
        default: "19800"

# Two runs would pick the same pending pages — queue, never overlap.
concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || vars.EXTRACT_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NEO4J_URI:      ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Same reader as the Render cron (see pipeline/extract_entry).
      EXTRACT_READER: langextract
      LANGEXTRACT_PROVIDER: openrouter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Run extraction
        env:
          WORKERS: ${{ inputs.workers || '24' }}
          MAX_SECONDS: ${{ inputs.max_seconds || '19800' }}
        run: python -m pipeline.load_extractions --workers "$WORKERS" --max-seconds "$MAX_SECONDS" --stale
