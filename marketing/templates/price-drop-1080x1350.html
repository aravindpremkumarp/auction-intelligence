<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auctionscope — Price Drop (1080×1350)</title>
<meta name="viewport" content="width=1080">
<!--
  Price-drop portrait (feed/carousel). Fires on re-auctions where
  previous_reserve_price > reserve_price. Adapted from motion-anything
  recipes (badge-pop from toast-pop, count-up, attention-pulse — Apache-2.0,
  see ATTRIBUTION.md). The drop % is computed from the two notice prices at
  bind time — never hand-written (honesty rule).
  Render: python marketing/render_social.py --template price-drop-1080x1350
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="lib/tokens.css">
<link rel="stylesheet" href="lib/motion.css">
<style>
  .drop-card { margin: 0 64px; border-radius: var(--radius-lg); }
  .was-row {
    display: flex; align-items: baseline; gap: 18px;
    font-size: 30px; color: var(--muted); margin-top: 10px;
  }
  .was-price {
    font-family: var(--font-display);
    font-size: 54px; font-weight: 600;
    text-decoration: line-through;
    text-decoration-thickness: 4px;
    text-decoration-color: var(--danger);
  }
  .drop-card .price { color: var(--good); font-size: 148px; }
  .now-row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .drop-arrow { font-size: 64px; color: var(--good); line-height: 1; }
</style>
</head>
<body>

<script id="data" type="application/json">
{
  "title": "Residential plot, Sarjapur Road",
  "city": "Bengaluru",
  "asset_type": "Plot · 2,400 sq ft",
  "bank": "Canara Bank",
  "previous_reserve_price": 9600000,
  "reserve_price": 8400000,
  "emd": 840000,
  "auction_date": "31 Jul 2026",
  "source_line": "Both prices from the bank's auction notices — earlier listing vs current re-auction."
}
</script>

<div class="stage stage-1080x1350" id="stage">
  <div class="s-head">
    <span class="s-eyebrow is-good"><span class="dot"></span>Price drop · re-auction</span>
    <span class="s-brand">
      <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b74f2"/><stop offset="1" stop-color="#2a5fe6"/></linearGradient></defs><rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#tile)"/><g transform="translate(236 236) scale(23)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.55" fill="#ffffff" stroke="none"/></g></svg>
      Auctionscope
    </span>
  </div>

  <div class="s-mid">
  <div class="sprop drop-card" data-stagger>
    <div class="loc"><span data-field="asset_type">Plot · 2,400 sq ft</span> · <span data-field="city">Bengaluru</span> · <span data-field="bank">Canara Bank</span></div>
    <div class="title" data-field="title">Residential plot, Sarjapur Road</div>
    <div class="was-row">Earlier reserve <span class="was-price" data-field="previous_reserve_price" data-field-format="inr">₹96 L</span></div>
    <div class="price-label">Reserve now</div>
    <div class="now-row">
      <div class="price" data-count="8400000" data-count-duration="900" data-field="reserve_price" data-field-format="inr">₹0</div>
      <span class="price-drop badge-pop" id="drop-badge">↓ <span id="drop-pct">–</span></span>
    </div>
    <div class="chips">
      <span class="chip">EMD <b data-field="emd" data-field-format="inr">₹8.4 L</b></span>
      <span class="chip is-accent">Auction <b data-field="auction_date">31 Jul 2026</b></span>
    </div>
  </div>
  </div>

  <div class="s-foot">
    <div class="s-honesty" data-field="source_line">Both prices from the bank's auction notices — earlier listing vs current re-auction.</div>
    <div class="s-cta">auctionscope.in</div>
  </div>
</div>

<script src="lib/motion.js"></script>
<script>
  // drop % is always computed from the two notice prices, never authored
  (function () {
    var d = AS.data || AS.bind();
    var prev = Number(d.previous_reserve_price), now = Number(d.reserve_price);
    var el = document.getElementById('drop-pct');
    if (prev > 0 && now > 0 && now < prev) {
      el.textContent = (Math.round(((prev - now) / prev) * 1000) / 10) + '%';
    } else {
      document.getElementById('drop-badge').style.display = 'none';
    }
  })();
</script>
</body>
</html>
