<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Auctionscope — News Reel (9:16, 12s)</title>
<!--
  News / build-in-public reel (Reels/Shorts/TikTok) — one headline, what it
  means for bidders, then the tie-in back to our live data. Render with:
    python marketing/render_reel.py --data <island.json> --template news-reel-1080x1920

  The poster pipeline only ever rewrites the #data island. Root data-duration
  is compile-time-locked at 12s by design — per-clip timing may vary, total
  length may not.

  Theme system: the island's "theme" ("light" | "dark") flips the semantic
  --r-* variables on #root[data-theme]; every color in the stylesheet reads a
  --r-* var (the headline card carries border: 1px solid var(--r-card-border)),
  and every color a GSAP tween touches comes from a JS const chosen by theme.

  Retention architecture (docs/marketing/copy-playbook.md Part 1 + the
  HyperFrames motion doctrine):
    bg    0-12     dot-grid wash, scale-drift so frame 0 already moves
    S1    0-2.2    HOOK — line1 VISIBLE ON FRAME 0 (never fade-from-nothing,
                   no branding), line2 kinetic word-slam
    S2    2.2-4.8  HEADLINE — newspaper-ish card push-slides up, source and
                   date chips stagger in under it
    S3    4.8-7.8  THE TWO POINTS — each an accent bar + word-by-word reveal,
                   strictly sequential
    S4    7.8-10.2 TIE-IN — our-data beat: the stat COUNTS UP huge (seek-safe
                   textContent modifiers), lands with the reel's single
                   back.out badge pulse, THEN the label lands under it
    S5    10.2-12  END-CARD — engagement question, factual save-line, small
                   url pill (no logo outro), and the headline's first word
                   re-enters small in the final 0.4s so the last frame rhymes
                   with frame 0.
  Exactly two transition treatments repeat through the piece: blur-crossfade
  entrances and bottom push-slides. Eases are long-tail power3/power4; the
  only overshoot is the S4 stat pulse.
-->
<!-- GSAP vendored in lib/ so renders never depend on CDN reachability -->
<script src="lib/gsap.min.js"></script>
<!-- Display font vendored for CI renders (Google Fonts is not reliably
     reachable from a runner; a missing display font fail-closes the look).
     Inter/JetBrains fall back to system stacks gracefully. -->
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('lib/fonts/bricolage-grotesque-latin.woff2') format('woff2');
    font-weight: 600 800;
    font-display: block;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --accent: #0052ff;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  /* Semantic theme variables — the island's "theme" picks the block. */
  #root[data-theme="dark"] {
    --r-bg: #0a0b0d; --r-fg: #f4f5f7; --r-muted: #9aa3b2; --r-hl: #7ea2ff;
    --r-dots: rgba(255,255,255,0.06);
    --r-wash-a: rgba(0,82,255,0.26); --r-wash-b: rgba(0,82,255,0.16);
    --r-chip-bg: rgba(255,255,255,0.08); --r-chip-fg: #cdd6e4;
    --r-card: #ffffff; --r-card-fg: #0a0b0d; --r-card-muted: #5b616e;
    --r-card-border: transparent;
  }
  #root[data-theme="light"] {
    --r-bg: #f6f7f9; --r-fg: #0a0b0d; --r-muted: #5b616e; --r-hl: #0052ff;
    --r-dots: rgba(10,11,13,0.07);
    --r-wash-a: rgba(0,82,255,0.10); --r-wash-b: rgba(0,82,255,0.07);
    --r-chip-bg: #e8f0ff; --r-chip-fg: #0052ff;
    --r-card: #ffffff; --r-card-fg: #0a0b0d; --r-card-muted: #5b616e;
    --r-card-border: #dee0e4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; font-family: var(--font-body); }
  #root {
    position: relative; width: 1080px; height: 1920px;
    overflow: hidden; background: var(--r-bg); color: var(--r-fg);
  }
  /* Animated background is a real element (GSAP can't reach ::before). */
  #bg {
    position: absolute; inset: -60px; /* bleed so the scale drift never shows edges */
    background:
      radial-gradient(80% 50% at 50% -10%, var(--r-wash-a) 0%, transparent 65%),
      radial-gradient(60% 40% at 50% 115%, var(--r-wash-b) 0%, transparent 60%),
      radial-gradient(var(--r-dots) 1.5px, transparent 1.5px);
    background-size: auto, auto, 44px 44px;
    will-change: transform;
  }
  .clip { position: absolute; inset: 0; padding: 140px 88px; }
  .word { display: inline-block; white-space: pre; }

  /* S1 hook — line1 on frame 0, no branding */
  #s1 { display: flex; flex-direction: column; justify-content: center; gap: 42px; }
  .hook-l1 {
    font-family: var(--font-display); font-size: 140px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.02; color: var(--r-fg);
    will-change: transform, filter;
  }
  .hook-l2 {
    font-family: var(--font-display); font-size: 92px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.08; color: var(--r-hl);
  }

  /* S2 headline card */
  #s2 { display: flex; flex-direction: column; justify-content: center; gap: 36px; }
  .headline-card {
    background: var(--r-card); color: var(--r-card-fg);
    border: 1px solid var(--r-card-border);
    border-radius: 32px; padding: 64px 60px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.35);
    will-change: transform;
  }
  .headline-text {
    font-family: var(--font-display); font-size: 72px; font-weight: 800;
    letter-spacing: -0.025em; line-height: 1.12; color: var(--r-card-fg);
  }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 18px; }
  .meta-chip {
    font-family: var(--font-mono); font-size: 27px; font-weight: 600;
    color: var(--r-chip-fg); background: var(--r-chip-bg);
    border-radius: 999px; padding: 14px 30px; will-change: transform;
  }

  /* S3 the two points */
  #s3 { display: flex; flex-direction: column; justify-content: center; gap: 64px; }
  .point { display: flex; align-items: stretch; gap: 30px; }
  .point-bar {
    width: 12px; border-radius: 999px; background: var(--accent);
    flex: 0 0 auto; transform-origin: center top; will-change: transform;
  }
  .point-text {
    font-family: var(--font-display); font-size: 56px; font-weight: 700;
    letter-spacing: -0.015em; line-height: 1.24; color: var(--r-fg);
  }

  /* S4 tie-in — the our-data beat */
  #s4 { display: flex; flex-direction: column; justify-content: center; gap: 34px; }
  .tiein-eyebrow {
    font-family: var(--font-mono); font-size: 32px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--r-muted);
  }
  .tiein-stat {
    font-family: var(--font-mono); font-size: 230px; font-weight: 700;
    letter-spacing: -0.05em; line-height: 1; color: var(--r-fg);
    font-variant-numeric: tabular-nums; will-change: transform;
  }
  .tiein-label {
    font-size: 42px; color: var(--r-muted); line-height: 1.35;
    max-width: 24ch; will-change: transform;
  }

  /* S5 end-card */
  #s5 { display: flex; flex-direction: column; justify-content: center; gap: 46px; }
  .end-q {
    font-family: var(--font-display); font-size: 96px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.08; color: var(--r-fg);
    max-width: 13ch;
  }
  .save-line {
    display: inline-flex; align-items: center; gap: 18px;
    font-family: var(--font-mono); font-size: 33px; color: var(--r-muted);
  }
  .save-line .flag {
    width: 30px; height: 38px; flex: 0 0 auto;
    background: var(--r-hl);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
  }
  .url-pill {
    align-self: flex-start; font-family: var(--font-mono); font-size: 32px;
    font-weight: 600; color: var(--r-card); background: var(--accent);
    border-radius: 999px; padding: 22px 48px;
  }
  .loop-echo {
    position: absolute; right: 88px; bottom: 130px;
    font-family: var(--font-display); font-size: 56px; font-weight: 800;
    letter-spacing: -0.03em; color: var(--r-muted); opacity: 0.55;
  }
</style>
</head>
<body>

<script id="data" type="application/json">
{ "theme": "dark",
  "hook": { "line1": "1 headline.", "line2": "what it means for bids." },
  "headline": "RBI holds repo rate steady",
  "source_label": "RBI · press release",
  "date_label": "12 Jul 2026",
  "points": ["EMIs stay put — auction affordability unchanged", "banks keep clearing NPAs — supply continues"],
  "tie_in": { "stat": "771", "label": "live TN bank auctions this week, regardless" },
  "endcard": { "question": "does news change your bidding plan?", "save_line": "save — the tie-in matters later", "url": "auctionscope.in" } }
</script>

<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="12" data-theme="dark">

  <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0" style="padding:0"></div>

  <section id="s1" class="clip" data-start="0" data-duration="2.2" data-track-index="1">
    <div class="hook-l1" id="hook-l1">1 headline.</div>
    <div class="hook-l2" id="hook-l2">what it means for bids.</div>
  </section>

  <section id="s2" class="clip" data-start="2.2" data-duration="2.6" data-track-index="1">
    <div class="headline-card" id="headline-card">
      <div class="headline-text" id="headline-text">Headline</div>
    </div>
    <div class="meta-chips" id="meta-chips">
      <span class="meta-chip" id="source-chip"></span>
      <span class="meta-chip" id="date-chip"></span>
    </div>
  </section>

  <section id="s3" class="clip" data-start="4.8" data-duration="3" data-track-index="1">
    <div id="points-host" style="display:flex;flex-direction:column;gap:64px"></div>
  </section>

  <section id="s4" class="clip" data-start="7.8" data-duration="2.4" data-track-index="1">
    <div class="tiein-eyebrow" id="tiein-eyebrow">on the platform right now</div>
    <div class="tiein-stat" id="tiein-stat">0</div>
    <div class="tiein-label" id="tiein-label"></div>
  </section>

  <section id="s5" class="clip" data-start="10.2" data-duration="1.8" data-track-index="1">
    <div class="end-q" id="end-q">does news change your bidding plan?</div>
    <div class="save-line" id="save-line"><span class="flag"></span><span id="save-text"></span></div>
    <div class="url-pill" id="url-pill">auctionscope.in</div>
    <div class="loop-echo" id="loop-echo">RBI</div>
  </section>

</div>

<script>
  // ---- data + DOM build (synchronous, before the timeline is registered) ----
  const DATA = JSON.parse(document.getElementById('data').textContent);

  function trimNum(n) { return String(Math.round(n * 100) / 100); }
  function formatINR(n) {
    if (n >= 1e7) return '₹' + trimNum(n / 1e7) + ' Cr';
    if (n >= 1e5) return '₹' + trimNum(n / 1e5) + ' L';
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  function setText(id, v) {
    const el = document.getElementById(id);
    if (v === null || v === undefined || v === '') { el.style.display = 'none'; }
    else { el.textContent = v; }
    return el;
  }
  function splitWords(el) {
    const words = el.textContent.split(/(\s+)/).filter(Boolean);
    el.textContent = '';
    words.forEach(part => {
      const s = document.createElement('span');
      s.className = 'word';
      s.textContent = part;
      el.appendChild(s);
    });
  }

  // Theme: the island picks the semantic --r-* block; any color a GSAP tween
  // touches comes from a theme-chosen JS const (CSS vars don't reach tweens).
  document.getElementById('root').dataset.theme = (DATA.theme === 'light') ? 'light' : 'dark';
  const HL = (DATA.theme === 'light') ? '#0052ff' : '#7ea2ff';

  // S1 — hook (validated upstream; no branding in scene 1)
  setText('hook-l1', DATA.hook.line1);
  setText('hook-l2', DATA.hook.line2);
  splitWords(document.getElementById('hook-l2'));

  // S2 — headline card + source/date chips (empty fields hide their slot)
  setText('headline-text', DATA.headline);
  setText('source-chip', DATA.source_label);
  setText('date-chip', DATA.date_label);

  // S3 — the two points, each an accent bar + word-by-word text
  const pointsHost = document.getElementById('points-host');
  (DATA.points || []).slice(0, 3).forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'point'; row.id = 'point-' + i;
    const bar = document.createElement('div'); bar.className = 'point-bar';
    const txt = document.createElement('div'); txt.className = 'point-text';
    txt.textContent = p;
    splitWords(txt);
    row.appendChild(bar); row.appendChild(txt);
    pointsHost.appendChild(row);
  });

  // S4 — the tie-in stat (our-data beat); count only when numeric
  const tieIn = DATA.tie_in || {};
  const statVal = parseInt(tieIn.stat, 10);
  const hasStat = Number.isFinite(statVal);
  const statEl = document.getElementById('tiein-stat');
  if (!hasStat) { setText('tiein-stat', tieIn.stat); }
  setText('tiein-label', tieIn.label);

  // S5 — engagement end-card + loop echo (headline's first word, small)
  setText('end-q', DATA.endcard.question);
  if (DATA.endcard.save_line) { setText('save-text', DATA.endcard.save_line); }
  else { document.getElementById('save-line').style.display = 'none'; }
  setText('url-pill', DATA.endcard.url || 'auctionscope.in');
  setText('loop-echo', (DATA.headline || '').trim().split(/\s+/)[0]);

  // ---- the one paused, registered timeline (HyperFrames contract) ----
  // Doctrine: long-tail power3/power4 eases; sequential reveal continues into
  // the back 50%; stillness + finite micro-drift during holds; the S4 stat
  // pulse is the single overshoot. Counters tween textContent with render-time
  // modifiers (onUpdate is suppressed under seek — a callback counter renders
  // 0). No rAF/Date.now/Math.random; no repeat:-1 (finite yoyo only).
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Background: frame 0 already moves (1-second retention signal), then a
  // finite slow breath — never a static hold, never repeat:-1.
  tl.fromTo('#bg', { scale: 1.06 }, { scale: 1.0, duration: 2.0, ease: 'power2.out' }, 0);
  tl.to('#bg', { scale: 1.012, duration: 2.5, ease: 'sine.inOut', repeat: 3, yoyo: true }, 2.0);

  // S1 HOOK — line1 visible ON frame 0: a visible from-state settling hard.
  tl.fromTo('#hook-l1',
    { scale: 1.18, autoAlpha: 0.9, filter: 'blur(6px)' },
    { scale: 1, autoAlpha: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power3.out' }, 0);
  tl.from('#hook-l2 .word', { y: 70, autoAlpha: 0, duration: 0.42, ease: 'power4.out', stagger: 0.08 }, 0.5);
  // micro-drift during the hold (finite, subtle)
  tl.to('#s1', { y: -6, duration: 0.55, ease: 'sine.inOut', repeat: 1, yoyo: true }, 1.0);
  // blur-crossfade out + hard kill at the boundary so a non-linear seek can
  // never land on stale visibility state
  tl.to('#s1', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 1.98);
  tl.set('#s1', { autoAlpha: 0 }, 2.2);

  // S2 HEADLINE — the card push-slides up; source + date chips under it.
  tl.from('#headline-card', { y: 180, autoAlpha: 0, duration: 0.65, ease: 'power3.out' }, 2.35);
  tl.from('#meta-chips .meta-chip', { y: 30, autoAlpha: 0, duration: 0.4, ease: 'power3.out', stagger: 0.12 }, 2.95);
  tl.to('#s2', { y: -8, duration: 0.55, ease: 'sine.inOut', repeat: 1, yoyo: true }, 3.6);
  tl.to('#s2', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 4.58);
  tl.set('#s2', { autoAlpha: 0 }, 4.8);

  // S3 THE TWO POINTS — strictly sequential: bar sweeps down, words land.
  (DATA.points || []).slice(0, 3).forEach((_, i) => {
    const at = 4.95 + i * 1.25;
    tl.fromTo('#point-' + i + ' .point-bar', { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: 'power3.out' }, at);
    tl.from('#point-' + i + ' .word', { y: 40, autoAlpha: 0, duration: 0.4, ease: 'power4.out', stagger: 0.05 }, at + 0.1);
  });
  tl.to('#s3', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 7.58);
  tl.set('#s3', { autoAlpha: 0 }, 7.8);

  // S4 TIE-IN — the our-data beat: the stat counts up huge, pulses (the
  // single overshoot), and only then does the label land under it.
  tl.from('#tiein-eyebrow', { y: 30, autoAlpha: 0, duration: 0.4, ease: 'power3.out' }, 7.95);
  tl.from('#tiein-stat', { autoAlpha: 0, y: 40, duration: 0.4, ease: 'power3.out' }, 8.05);
  if (hasStat) {
    tl.fromTo(statEl, { textContent: 0 }, {
      textContent: statVal, duration: 1.1, ease: 'power2.out',
      modifiers: { textContent: v => Math.round(parseFloat(v)).toLocaleString('en-IN') }
    }, 8.05);
  }
  // land: highlight shift + badge-like pulse (scale 1 → 1.06 → settle back.out)
  tl.to(statEl, { color: HL, duration: 0.3, ease: 'power2.out' }, 9.15);
  tl.to(statEl, { scale: 1.06, duration: 0.13, ease: 'power2.in' }, 9.15);
  tl.to(statEl, { scale: 1, duration: 0.38, ease: 'back.out(2.5)' }, 9.3);
  tl.from('#tiein-label', { y: 30, autoAlpha: 0, duration: 0.45, ease: 'power3.out' }, 9.45);
  tl.to('#s4', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 9.98);
  tl.set('#s4', { autoAlpha: 0 }, 10.2);

  // S5 END-CARD — the question does the work; no logo outro.
  tl.from('#end-q', { y: 80, autoAlpha: 0, duration: 0.55, ease: 'power3.out' }, 10.35);
  tl.from('#save-line', { y: 40, autoAlpha: 0, duration: 0.45, ease: 'power3.out' }, 10.85);
  tl.from('#url-pill', { y: 40, autoAlpha: 0, duration: 0.45, ease: 'power3.out' }, 11.1);
  // loop-back: the headline's first word re-enters low-key so frame 359
  // rhymes with frame 0
  tl.fromTo('#loop-echo', { y: 60, autoAlpha: 0 },
    { y: 0, autoAlpha: 0.55, duration: 0.4, ease: 'power3.out' }, 11.6);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
