<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Auctionscope — Deal Reel (9:16, 12s)</title>
<!--
  Per-auction deal reel (Reels/Shorts/TikTok) — one parameterized composition
  covering all three Deals angles (price_drop / closing_soon / cheapest); the
  #data island's "angle" branches the S3 money treatment. Render with:
    python marketing/render_reel.py --data <island.json>
  (or directly: npx hyperframes@0.7.52 render marketing/templates/deal-reel-1080x1920.html)

  The poster pipeline only ever rewrites the #data island (see
  marketing_agents/poster.py draft_to_reel_island). Root data-duration is
  compile-time-locked at 12s by design — per-clip timing may vary, total
  length may not.

  Retention architecture (docs/marketing/copy-playbook.md Part 1 + the
  HyperFrames motion doctrine; research: Meta's 1.0s early-retention signal,
  >60% 3s-hold = 5-10x reach):
    bg    0-12    dot-grid wash, scale-drift so frame 0 already moves
    S1    0-2.2   HOOK — the ₹ figure VISIBLE ON FRAME 0 (never fade-from-
                  nothing, no branding), line2 kinetic word-slam
    S2    2.2-4.6 CURIOSITY GAP — two context lines that withhold the payoff
    S3    4.6-8.2 MONEY REVEAL (angle-branched) — seek-safe count, synced
                  underline sweep, the reel's single back.out punch
    S4    8.2-10.2 PROOF — facts card push-slide + per-angle honesty line
    S5    10.2-12 END-CARD — engagement question (mirrors the pinned
                  comment), factual save-line, small url pill (no logo
                  outro), and the S1 figure re-enters in the final 0.4s so
                  the last frame rhymes with frame 0 (seamless-loop rewatch).
  Exactly two transition treatments repeat through the piece: blur-crossfade
  entrances and bottom push-slides. Eases are long-tail power3/power4; the
  only overshoot is the S3 badge punch.

  Rendered text (hook, context lines, question, save line) is written by the
  Poster and passes the honesty gates in validate_drafts() before it can
  reach this island. Numbers come from the auction's own notice fields.
-->
<!-- GSAP vendored in lib/ so renders never depend on CDN reachability -->
<script src="lib/gsap.min.js"></script>
<!-- Display font vendored for CI renders (Google Fonts is not reliably
     reachable from a runner; a missing display font fail-closes the look).
     Inter/JetBrains fall back to system stacks gracefully. -->
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('lib/fonts/bricolage-grotesque-latin.woff2') format('woff2');
    font-weight: 600 800;
    font-display: block;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --accent: #0052ff; --accent-soft: #e8f0ff;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-display: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  /* Theme system: the island's "theme" ("dark" default | "light") picks the
     palette; the JS sets data-theme on #root before the timeline registers. */
  #root[data-theme="dark"] {
    --r-bg: #0a0b0d; --r-fg: #f4f5f7; --r-muted: #9aa3b2; --r-hl: #7ea2ff;
    --r-dots: rgba(255,255,255,0.06);
    --r-wash-a: rgba(0,82,255,0.26); --r-wash-b: rgba(0,82,255,0.16);
    --r-card: #ffffff; --r-card-fg: #0a0b0d; --r-card-muted: #5b616e;
    --r-card-border: transparent;
  }
  #root[data-theme="light"] {
    --r-bg: #f6f7f9; --r-fg: #0a0b0d; --r-muted: #5b616e; --r-hl: #0052ff;
    --r-dots: rgba(10,11,13,0.07);
    --r-wash-a: rgba(0,82,255,0.10); --r-wash-b: rgba(0,82,255,0.07);
    --r-card: #ffffff; --r-card-fg: #0a0b0d; --r-card-muted: #5b616e;
    --r-card-border: #dee0e4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; font-family: var(--font-body); }
  #root {
    position: relative; width: 1080px; height: 1920px;
    overflow: hidden; background: var(--r-bg); color: var(--r-fg);
  }
  /* Animated background is a real element (GSAP can't reach ::before). */
  #bg {
    position: absolute; inset: -60px; /* bleed so the scale drift never shows edges */
    background:
      radial-gradient(80% 50% at 50% -10%, var(--r-wash-a) 0%, transparent 65%),
      radial-gradient(60% 40% at 50% 115%, var(--r-wash-b) 0%, transparent 60%),
      radial-gradient(var(--r-dots) 1.5px, transparent 1.5px);
    background-size: auto, auto, 44px 44px;
    will-change: transform;
  }
  .clip { position: absolute; inset: 0; padding: 140px 88px; }
  .word { display: inline-block; white-space: pre; }

  /* S1 hook — value on frame 0, no branding */
  #s1 { display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .hook-l1 {
    font-family: var(--font-mono); font-size: 150px; font-weight: 700;
    letter-spacing: -0.04em; line-height: 1; color: var(--r-fg);
    font-variant-numeric: tabular-nums; will-change: transform, filter;
  }
  .hook-l2 {
    font-family: var(--font-display); font-size: 112px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.05; color: var(--r-hl);
  }

  /* S2 curiosity gap */
  #s2 { display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  .ctx {
    font-family: var(--font-display); font-size: 96px; font-weight: 700;
    letter-spacing: -0.025em; line-height: 1.1; color: var(--r-fg);
  }
  .ctx.second { color: var(--r-hl); }

  /* S3 money reveal */
  #s3 { display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .money-label {
    font-family: var(--font-mono); font-size: 34px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--r-muted);
  }
  .money-line { position: relative; display: inline-block; }
  .money-value {
    font-family: var(--font-mono); font-size: 210px; font-weight: 700;
    letter-spacing: -0.05em; line-height: 1; color: var(--r-fg);
    font-variant-numeric: tabular-nums; will-change: transform;
  }
  .money-underline {
    position: absolute; left: 4px; right: 4px; bottom: -26px; height: 8px;
    border-radius: 999px; background: var(--accent);
    transform-origin: left center; will-change: transform;
  }
  .money-badge {
    align-self: flex-start; margin-top: 54px;
    font-family: var(--font-mono); font-size: 44px; font-weight: 700;
    color: #fff; background: var(--accent); border-radius: 999px;
    padding: 20px 42px; will-change: transform;
  }
  .money-sub {
    margin-top: 22px; font-size: 40px; color: var(--r-muted); line-height: 1.35;
    max-width: 20ch;
  }

  /* S4 proof card */
  #s4 { display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .facts-card {
    background: var(--r-card); color: var(--r-card-fg);
    border: 1px solid var(--r-card-border);
    border-radius: 32px; padding: 64px 60px;
    display: flex; flex-direction: column; gap: 24px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.55);
    will-change: transform;
  }
  .facts-loc {
    font-family: var(--font-mono); font-size: 27px; color: var(--r-card-muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .facts-title {
    font-family: var(--font-display); font-size: 60px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.08;
  }
  .facts-chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 8px; }
  .chip {
    font-family: var(--font-mono); font-size: 27px; color: var(--accent);
    background: var(--accent-soft); border-radius: 999px; padding: 14px 30px;
  }
  .honesty { font-size: 25px; color: var(--r-muted); line-height: 1.45; max-width: 38ch; }

  /* S5 end-card */
  #s5 { display: flex; flex-direction: column; justify-content: center; gap: 46px; }
  .end-q {
    font-family: var(--font-display); font-size: 104px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.08; color: var(--r-fg);
    max-width: 12ch;
  }
  .save-line {
    display: inline-flex; align-items: center; gap: 18px;
    font-family: var(--font-mono); font-size: 33px; color: var(--r-muted);
  }
  .save-line .flag {
    width: 30px; height: 38px; flex: 0 0 auto;
    background: var(--r-hl);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
  }
  .url-pill {
    align-self: flex-start; font-family: var(--font-mono); font-size: 32px;
    font-weight: 600; color: #fff; background: var(--accent);
    border-radius: 999px; padding: 22px 48px;
  }
  .loop-echo {
    position: absolute; right: 88px; bottom: 130px;
    font-family: var(--font-mono); font-size: 58px; font-weight: 700;
    letter-spacing: -0.03em; color: var(--r-muted); opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<script id="data" type="application/json">
{
  "angle": "price_drop",
  "theme": "dark",
  "hook": { "line1": "₹45L → ₹38L", "line2": "nobody bid." },
  "context_lines": ["didn't sell last round", "the bank cut the reserve"],
  "money": { "previous_reserve_price": 4500000, "reserve_price": 3800000, "drop_pct": 15.6 },
  "facts": { "title": "Residential Plot, Gnanamurthy Nagar", "city": "Chennai", "bank": "Canara Bank", "asset_type": "Plot", "emd": 380000, "auction_date": "24 Jul 2026", "days_left": 11 },
  "endcard": { "question": "would you bid on this?", "save_line": "bids close 24 jul — save this", "url": "auctionscope.in" },
  "honesty_line": "Both prices from the bank's auction notices — earlier listing vs current re-auction."
}
</script>

<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="12">

  <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0" style="padding:0"></div>

  <section id="s1" class="clip" data-start="0" data-duration="2.2" data-track-index="1">
    <div class="hook-l1" id="hook-l1">₹45L → ₹38L</div>
    <div class="hook-l2" id="hook-l2">nobody bid.</div>
  </section>

  <section id="s2" class="clip" data-start="2.2" data-duration="2.4" data-track-index="1">
    <div class="ctx" id="ctx1">didn't sell last round</div>
    <div class="ctx second" id="ctx2">the bank cut the reserve</div>
  </section>

  <section id="s3" class="clip" data-start="4.6" data-duration="3.6" data-track-index="1">
    <div class="money-label" id="money-label">flat · city</div>
    <div class="money-line">
      <div class="money-value" id="money-value">₹0.0L</div>
      <div class="money-underline" id="money-underline"></div>
    </div>
    <div class="money-badge" id="money-badge">−15.6%</div>
    <div class="money-sub" id="money-sub"></div>
  </section>

  <section id="s4" class="clip" data-start="8.2" data-duration="2" data-track-index="1">
    <div class="facts-card" id="facts-card">
      <div class="facts-loc" id="facts-loc">City · Bank</div>
      <div class="facts-title" id="facts-title">Property title</div>
      <div class="facts-chips" id="facts-chips"></div>
    </div>
    <div class="honesty" id="honesty-line"></div>
  </section>

  <section id="s5" class="clip" data-start="10.2" data-duration="1.8" data-track-index="1">
    <div class="end-q" id="end-q">would you bid on this?</div>
    <div class="save-line" id="save-line"><span class="flag"></span><span id="save-text"></span></div>
    <div class="url-pill" id="url-pill">auctionscope.in</div>
    <div class="loop-echo" id="loop-echo">₹38L</div>
  </section>

</div>

<script>
  // ---- data + DOM build (synchronous, before the timeline is registered) ----
  const DATA = JSON.parse(document.getElementById('data').textContent);

  function trimNum(n) { return String(Math.round(n * 100) / 100); }
  function formatINR(n) {
    if (n >= 1e7) return '₹' + trimNum(n / 1e7) + ' Cr';
    if (n >= 1e5) return '₹' + trimNum(n / 1e5) + ' L';
    return '₹' + Math.round(n).toLocaleString('en-IN');
  }
  function lakhs(n) { return n / 1e5; }
  function setText(id, v) {
    const el = document.getElementById(id);
    if (v === null || v === undefined || v === '') { el.style.display = 'none'; }
    else { el.textContent = v; }
    return el;
  }
  function splitWords(el) {
    const words = el.textContent.split(/(\s+)/).filter(Boolean);
    el.textContent = '';
    words.forEach(part => {
      const s = document.createElement('span');
      s.className = 'word';
      s.textContent = part;
      el.appendChild(s);
    });
  }

  const THEME = (DATA.theme === 'light') ? 'light' : 'dark';
  document.getElementById('root').dataset.theme = THEME;
  const HL = THEME === 'light' ? '#0052ff' : '#7ea2ff';

  const angle = DATA.angle || 'price_drop';
  const money = DATA.money || {};
  const facts = DATA.facts || {};
  const reserveL = lakhs(money.reserve_price || 0);
  const prevL = money.previous_reserve_price ? lakhs(money.previous_reserve_price) : null;

  // S1 — the ₹ figure is the Poster-selected reel hook (validated: has a digit)
  setText('hook-l1', DATA.hook.line1);
  setText('hook-l2', DATA.hook.line2);
  splitWords(document.getElementById('hook-l2'));

  // S2 — curiosity gap
  setText('ctx1', (DATA.context_lines || [])[0]);
  setText('ctx2', (DATA.context_lines || [])[1]);
  splitWords(document.getElementById('ctx1'));
  splitWords(document.getElementById('ctx2'));

  // S3 — angle-branched money block (all figures from the notice fields)
  const label = [facts.asset_type, facts.city].filter(Boolean).join(' · ').toLowerCase();
  setText('money-label', label);
  const valueEl = document.getElementById('money-value');
  let badgeText = null, subText = '';
  if (angle === 'price_drop' && prevL) {
    badgeText = money.drop_pct != null ? '−' + trimNum(money.drop_pct) + '%' : null;
    subText = 'the new reserve after a failed auction';
  } else if (angle === 'cheapest') {
    badgeText = facts.city ? 'cheapest this week · ' + facts.city.toLowerCase() : 'cheapest this week';
    subText = 'the lowest live reserve a bank lists' + (facts.city ? ' in ' + facts.city.toLowerCase() : '');
  } else { // closing_soon
    badgeText = facts.days_left != null ? facts.days_left + ' days left' : null;
    subText = facts.emd ? 'you don’t need the full amount to bid — EMD ' + formatINR(facts.emd) : '';
  }
  setText('money-badge', badgeText);
  setText('money-sub', subText);

  // S4 — proof card (empty fields hide their slot; nothing is invented)
  setText('facts-loc', [facts.city, facts.bank].filter(Boolean).join(' · '));
  setText('facts-title', facts.title);
  const chipsHost = document.getElementById('facts-chips');
  [facts.auction_date ? 'auction ' + facts.auction_date : null,
   facts.emd ? 'EMD ' + formatINR(facts.emd) : null]
    .filter(Boolean).forEach(t => {
      const c = document.createElement('span');
      c.className = 'chip'; c.textContent = t; chipsHost.appendChild(c);
    });
  setText('honesty-line', DATA.honesty_line);

  // S5 — engagement end-card + loop echo
  setText('end-q', DATA.endcard.question);
  if (DATA.endcard.save_line) { setText('save-text', DATA.endcard.save_line); }
  else { document.getElementById('save-line').style.display = 'none'; }
  setText('url-pill', DATA.endcard.url || 'auctionscope.in');
  // The echo is the settled hero figure, so the last frame rhymes with frame 0.
  setText('loop-echo', '₹' + trimNum(reserveL) + 'L');

  // ---- the one paused, registered timeline (HyperFrames contract) ----
  // Doctrine: long-tail power3/power4 eases; sequential reveal continues into
  // the back 50%; stillness + finite micro-drift during holds; the S3 badge
  // punch is the single overshoot. Counters tween textContent with render-time
  // modifiers (onUpdate is suppressed under seek — a callback counter renders 0).
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // Background: frame 0 already moves (1-second retention signal), then a
  // finite slow breath — never a static hold, never repeat:-1.
  tl.fromTo('#bg', { scale: 1.06 }, { scale: 1.0, duration: 2.0, ease: 'power2.out' }, 0);
  tl.to('#bg', { scale: 1.012, duration: 2.5, ease: 'sine.inOut', repeat: 3, yoyo: true }, 2.0);

  // S1 HOOK — value visible ON frame 0: a visible from-state settling hard.
  tl.fromTo('#hook-l1',
    { scale: 1.18, autoAlpha: 0.85, filter: 'blur(6px)' },
    { scale: 1, autoAlpha: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power3.out' }, 0);
  tl.from('#hook-l2 .word', { y: 70, autoAlpha: 0, duration: 0.42, ease: 'power4.out', stagger: 0.08 }, 0.5);
  // micro-drift during the hold (finite, subtle)
  tl.to('#s1', { y: -6, duration: 0.55, ease: 'sine.inOut', repeat: 1, yoyo: true }, 1.0);
  // blur-crossfade out (transition type 1) + hard kill at the boundary so a
  // non-linear seek can never land on stale visibility state
  tl.to('#s1', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 1.98);
  tl.set('#s1', { autoAlpha: 0 }, 2.2);

  // S2 CURIOSITY GAP — sequential word reveals; second line lands cobalt.
  tl.from('#ctx1 .word', { y: 60, autoAlpha: 0, duration: 0.45, ease: 'power4.out', stagger: 0.07 }, 2.35);
  tl.from('#ctx2 .word', { y: 60, autoAlpha: 0, duration: 0.45, ease: 'power4.out', stagger: 0.07 }, 3.25);
  tl.to('#s2', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 4.38);
  tl.set('#s2', { autoAlpha: 0 }, 4.6);

  // S3 MONEY REVEAL — the payoff. Label first (small), then the number works.
  tl.from('#money-label', { y: 30, autoAlpha: 0, duration: 0.4, ease: 'power3.out' }, 4.75);
  const COUNT_START = 5.0, COUNT_DUR = 1.5, LAND = COUNT_START + COUNT_DUR; // 6.5
  const fmtLakh = v => '₹' + parseFloat(v).toFixed(1) + 'L';
  if (angle === 'price_drop' && prevL) {
    // downward count prev → now, underline sweep synced to the count
    tl.fromTo(valueEl, { textContent: prevL }, {
      textContent: reserveL, duration: COUNT_DUR, ease: 'power3.out',
      modifiers: { textContent: fmtLakh }
    }, COUNT_START);
  } else if (angle === 'cheapest') {
    tl.fromTo(valueEl, { textContent: 0 }, {
      textContent: reserveL, duration: 1.4, ease: 'power3.out',
      modifiers: { textContent: fmtLakh }
    }, COUNT_START);
  } else {
    // closing_soon: the number stamps — urgency reads as certainty, not motion
    valueEl.textContent = fmtLakh(reserveL);
    tl.fromTo(valueEl, { scale: 1.3, autoAlpha: 0 },
      { scale: 1, autoAlpha: 1, duration: 0.45, ease: 'power3.out' }, COUNT_START);
  }
  tl.from('#money-value', { autoAlpha: 0, duration: 0.25, ease: 'power2.out' }, 4.9);
  tl.fromTo('#money-underline', { scaleX: 0 },
    { scaleX: 1, duration: COUNT_DUR, ease: 'power3.out' }, COUNT_START);
  // land: color shift + settle, then the badge punch — the single overshoot
  tl.to('#money-value', { color: HL, y: 14, duration: 0.35, ease: 'power3.out' }, LAND);
  tl.from('#money-badge', { scale: 0.4, autoAlpha: 0, duration: 0.5, ease: 'back.out(2.2)' }, LAND + 0.15);
  tl.from('#money-sub', { y: 30, autoAlpha: 0, duration: 0.45, ease: 'power3.out' }, LAND + 0.55);
  tl.to('#s3', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 7.98);
  tl.set('#s3', { autoAlpha: 0 }, 8.2);

  // S4 PROOF — push-slide (transition type 2): the notice card, not an ad.
  tl.from('#facts-card', { y: 180, autoAlpha: 0, duration: 0.6, ease: 'power3.out' }, 8.35);
  tl.from('#facts-chips .chip', { y: 30, autoAlpha: 0, duration: 0.4, ease: 'power3.out', stagger: 0.12 }, 8.8);
  tl.from('#honesty-line', { autoAlpha: 0, duration: 0.4 }, 9.35);
  tl.to('#s4', { autoAlpha: 0, filter: 'blur(10px)', duration: 0.22, ease: 'power2.in' }, 10.0);
  tl.set('#s4', { autoAlpha: 0 }, 10.2);

  // S5 END-CARD — the question does the work; no logo outro.
  tl.from('#end-q', { y: 80, autoAlpha: 0, duration: 0.55, ease: 'power3.out' }, 10.35);
  tl.from('#save-line', { y: 40, autoAlpha: 0, duration: 0.45, ease: 'power3.out' }, 10.85);
  tl.from('#url-pill', { y: 40, autoAlpha: 0, duration: 0.45, ease: 'power3.out' }, 11.1);
  // loop-back: the hero figure re-enters low-key so frame 359 rhymes with frame 0
  tl.fromTo('#loop-echo', { y: 60, autoAlpha: 0 },
    { y: 0, autoAlpha: 0.55, duration: 0.4, ease: 'power3.out' }, 11.6);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
