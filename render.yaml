services:
  - type: web
    name: auction-api
    runtime: python
    plan: free
    region: singapore
    # Install from the fully pinned lock so deploys are byte-reproducible;
    # requirements.txt holds the ranges, requirements.lock the resolution.
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    # Idempotent Neo4j constraint/index setup (IF NOT EXISTS), run after build
    # and before the new version goes live, with the service env vars present.
    # Requires a paid instance type — Render skips pre-deploy on the free plan.
    preDeployCommand: python -m scripts.init_auth_schema
    # /health checks the API itself; / serves the SPA and would report 200
    # even with the graph down.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FEEDBACK_RESOLVE_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_ENV
        value: prod
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: MINERU_API_KEY
        sync: false
      # Razorpay paid-tier unlock. Secrets are set in the dashboard (sync:
      # false); the non-secret tunables carry their defaults here.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_AMOUNT
        value: "49900"
      - key: RAZORPAY_PLAN_CURRENCY
        value: INR
      - key: RAZORPAY_PLAN_DAYS
        value: "30"
      - key: RAZORPAY_WEBHOOK_TTL_DAYS
        value: "90"
