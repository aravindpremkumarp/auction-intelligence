services:
  - type: web
    name: auction-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FEEDBACK_RESOLVE_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_TTL_MIN
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_ENV
        value: prod
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
