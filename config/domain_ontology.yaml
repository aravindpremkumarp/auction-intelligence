id: bank_auction_intelligence
name: Bank Auction Intelligence
description: >
  AI-powered intelligence system for Indian SARFAESI Act bank property auctions.
  Users query a Neo4j knowledge graph of auction properties to find investment
  opportunities, compare prices across locations, analyze bank portfolios, perform
  due diligence, and track their investment pipeline.

version: "0.1.0"

entity_types:
  AuctionProperty:
    description: A single bank auction listing
    key: auction_id
    properties:
      auction_id: {type: string, unique: true}
      title: {type: string}
      url: {type: string}
      description: {type: text}
      reserve_price_num: {type: float}
      emd_num: {type: float}
      auction_start_dt: {type: datetime}
      auction_end_dt: {type: datetime}
      application_deadline_dt: {type: datetime}
      total_area: {type: string}
      village: {type: string}
      taluk: {type: string}
      district: {type: string}
      registration_district: {type: string}
      registration_sub_district: {type: string}
      description_completeness: {type: float}
      extraction_date: {type: datetime}

  Bank:
    description: Bank conducting the auction
    key: name
    properties:
      name: {type: string, unique: true}
      short_name: {type: string}  # abbreviated label for card UI display; falls back to name when uncurated

  Branch:
    description: Specific bank branch listing the auction
    key: name
    properties:
      name: {type: string, unique: true}

  City:
    key: name
    properties:
      name: {type: string, unique: true}

  State:
    key: name
    properties:
      name: {type: string, unique: true}

  Area:
    description: Sub-area or locality within a city
    key: name
    properties:
      name: {type: string, unique: true}

  AssetCategory:
    description: Top-level asset classification (Immovable, Movable, etc.)
    key: name
    properties:
      name: {type: string, unique: true}

  PropertyType:
    description: Property classification (Residential, Commercial, Plot, etc.)
    key: name
    properties:
      name: {type: string, unique: true}

  Borrower:
    description: Original borrower whose property is being auctioned
    key: name
    properties:
      name: {type: string, unique: true}

  AuctionType:
    description: Auction legal classification (SARFAESI, DRT, etc.)
    key: name
    properties:
      name: {type: string, unique: true}

  # ── New entities added for agent intelligence ──────────────────────────────
  InvestmentTracker:
    description: User's pipeline state and scoring for an auction
    key: auction_id
    properties:
      auction_id: {type: string, unique: true}
      state: {type: string, enum: [DISCOVERED, SCORED, SHORTLISTED, RESEARCHING, BID_READY, BID_SUBMITTED, WON, LOST, COMPLETED]}
      composite_score: {type: float}
      grade: {type: string, enum: ["A+", A, B, C, D, F]}
      dimension_scores: {type: string, description: "JSON-serialized per-dimension scores"}
      notes: {type: text}
      created_at: {type: datetime}
      updated_at: {type: datetime}

  InvestorProfile:
    description: User preferences driving shortlisting and alerts
    key: name
    properties:
      name: {type: string, unique: true}
      budget_min: {type: float}
      budget_max: {type: float}
      preferred_cities: {type: list}
      preferred_property_types: {type: list}
      risk_tolerance: {type: string, enum: [conservative, moderate, aggressive]}

  DecisionTrace:
    description: Agent reasoning provenance for auditability
    key: trace_id
    properties:
      trace_id: {type: string, unique: true}
      query: {type: text}
      reasoning: {type: text}
      recommendation: {type: text}
      confidence: {type: float}
      created_at: {type: datetime}

  # ── User management (internal; excluded from LLM-facing schema) ────────────
  User:
    description: Authenticated end-user of the system (doc-only; not exposed to agent tools)
    key: id
    properties:
      id: {type: string, unique: true}
      email: {type: string, unique: true}
      password_hash: {type: string}
      name: {type: string}
      role: {type: string, enum: [user, admin]}
      email_verified: {type: boolean}
      enabled: {type: boolean}
      created_at: {type: datetime}
      last_login_at: {type: datetime}

  RefreshToken:
    description: Persisted refresh-token jti for revocation
    key: jti
    properties:
      jti: {type: string, unique: true}
      user_id: {type: string}
      issued_at: {type: datetime}
      expires_at: {type: datetime}
      revoked_at: {type: datetime}
      user_agent: {type: string}
      ip: {type: string}

  VerificationToken:
    description: One-time token for email verification and password reset
    key: token
    properties:
      token: {type: string, unique: true}
      user_id: {type: string}
      purpose: {type: string, enum: [verify_email, reset_password]}
      expires_at: {type: datetime}
      used_at: {type: datetime}

relationships:
  - {type: CONDUCTED_BY,        from: AuctionProperty, to: Bank}
  - {type: HAS_BRANCH,          from: Bank,            to: Branch}
  - {type: LISTED_BY_BRANCH,    from: AuctionProperty, to: Branch}
  - {type: LOCATED_IN_CITY,     from: AuctionProperty, to: City}
  - {type: LOCATED_IN_STATE,    from: AuctionProperty, to: State}
  - {type: LOCATED_IN_AREA,     from: AuctionProperty, to: Area}
  - {type: PART_OF_CITY,        from: Area,            to: City}
  - {type: IN_STATE,            from: City,            to: State}
  - {type: HAS_ASSET_CATEGORY,  from: AuctionProperty, to: AssetCategory}
  - {type: HAS_TYPE,            from: AssetCategory,   to: PropertyType}
  - {type: HAS_BORROWER,        from: AuctionProperty, to: Borrower}
  - {type: IS_AUCTION_TYPE,     from: AuctionProperty, to: AuctionType}
  - {type: TRACKED_BY,          from: AuctionProperty, to: InvestmentTracker}
  - {type: INTERESTED_IN,       from: InvestorProfile, to: AuctionProperty}
  - {type: ABOUT,               from: DecisionTrace,   to: AuctionProperty}
  - {type: REQUESTED_BY,        from: DecisionTrace,   to: InvestorProfile}

agent_tools:
  - name: search_auctions
    description: Filter auctions by price range, city, property type, asset category, date window
    parameters:
      min_price: {type: float, optional: true}
      max_price: {type: float, optional: true}
      city: {type: string, optional: true}
      property_type: {type: string, optional: true}
      asset_category: {type: string, optional: true}
      starts_after: {type: datetime, optional: true}
      starts_before: {type: datetime, optional: true}
      limit: {type: int, default: 20}

  - name: find_similar_properties
    description: Given an auction_id, find comparable properties in same area with similar price
    parameters:
      auction_id: {type: string}
      price_tolerance_pct: {type: float, default: 25.0}
      limit: {type: int, default: 10}

  - name: bank_portfolio
    description: All auctions by a given bank with aggregated statistics
    parameters:
      bank_name: {type: string}

  - name: location_analysis
    description: Price distribution and auction density for a city or area
    parameters:
      location: {type: string}
      location_type: {type: string, enum: [city, area, state], default: city}

  # `upcoming_auctions` (deadline within N days) and `borrower_lookup` are now
  # parameters of search_auctions (`deadline_within_days`, `borrower`), not
  # standalone tools.
  - name: price_comparison
    description: Compare reserve prices for similar properties in the same area
    parameters:
      city: {type: string}
      property_type: {type: string}

  # ── Scoring & tracking tools (Phase 2-3) ──
  # score_auction was removed from the chat agent (weak heuristics — see
  # scoring/auction_scorer.py); the scorer module remains for offline use.

  - name: batch_score
    description: Score all auctions matching a filter criteria
    parameters:
      criteria: {type: object, description: "Same filter shape as search_auctions"}

  - name: update_tracker_state
    description: Transition an auction to a new pipeline state (requires user confirmation for states past SCORED)
    parameters:
      auction_id: {type: string}
      new_state: {type: string}
      notes: {type: string, optional: true}

decision_thresholds:
  strong_buy: 85       # A / A+ — bid immediately
  worth_pursuing: 70   # B — complete due diligence
  selective: 55        # C — only if matches specific criteria
  skip: 0              # D / F

data_source:
  type: neo4j
  uri_env: NEO4J_URI
  username_env: NEO4J_USERNAME
  password_env: NEO4J_PASSWORD
  database_env: NEO4J_DATABASE
  existing_records:
    total_scraped: 53813
    tamil_nadu_filtered: 3391
