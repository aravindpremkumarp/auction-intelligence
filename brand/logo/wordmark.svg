        <rect x="300" y="300" width="26" height="190" rx="13" fill="#0052ff" opacity="0.16"/>
        <rect x="568" y="300" width="26" height="190" rx="13" fill="#0052ff" opacity="0.16"/>
        <rect x="412" y="470" width="74" height="330" rx="37" fill="url(#metal)"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="452" y="296" font-family="Inter, system-ui, sans-serif" font-size="200" font-weight="700" letter-spacing="-6">
    <tspan fill="#0a0b0d">Auction</tspan><tspan fill="#0052ff">Scope</tspan>
