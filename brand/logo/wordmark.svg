<svg width="1900" height="460" viewBox="0 0 1900 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b74f2"/>
      <stop offset="1" stop-color="#2a5fe6"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(40 50)">
    <rect x="0" y="0" width="360" height="360" rx="82" fill="url(#tile)"/>
    <g transform="translate(83 83) scale(8.0859375)" fill="none" stroke="#ffffff"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2"  x2="5"  y1="12" y2="12"/>
      <line x1="19" x2="22" y1="12" y2="12"/>
      <line x1="12" x2="12" y1="2"  y2="5"/>
      <line x1="12" x2="12" y1="19" y2="22"/>
      <circle cx="12" cy="12" r="7"/>
      <circle cx="12" cy="12" r="1.55" fill="#ffffff" stroke="none"/>
    </g>
  </g>

  <!-- Wordmark: "Auction" dark slate + "scope" gray, one lowercase word -->
  <text x="452" y="296" font-family="Inter, system-ui, sans-serif" font-size="200" font-weight="700" letter-spacing="-7">
    <tspan fill="#1f2a37">Auction</tspan><tspan fill="#98a1ad">scope</tspan>
  </text>
</svg>
